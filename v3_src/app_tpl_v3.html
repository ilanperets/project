<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מנוע כמויות</title>
<style>
{{FONTS}}
:root{
  color-scheme:light;
  --bg:#EEF2F7; --surface:#FFFFFF; --sunk:#F6F8FB;
  --ink:#0E1B2B; --ink-2:#43536A; --ink-3:#74839A;
  --line:#E0E6EF; --line-2:#C8D2E0;
  --bp-1:#06255A; --bp-2:#0D43A0; --bp-3:#1F6FD1;
  --accent:#1F6FD1; --accent-2:#174F96; --accent-soft:#E6F0FC; --accent-mid:#8DB8EE;
  --boq:#D9622B; --boq-soft:#FCEEE6;
  --ok:#1C8248; --ok-bg:#E1F3E8;
  --near:#946300; --near-bg:#FBF0D3; --near-bar:#E0A82E;
  --gap:#C0392B; --gap-bg:#FBE5E2;
  --under:#6A4BCF; --under-bg:#EEE9FB;
  --na:#5F6B78; --na-bg:#EDF0F3;
  --field:#FFF8E1; --field-line:#E9C766;
  --olga:#0E9384; --hofim:#5B5BD6; --villa:#B7791F;
  --sh:0 1px 2px rgba(14,27,43,.05),0 8px 24px -12px rgba(14,27,43,.14);
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Rubik",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 420px at 85% -80px,rgba(31,111,209,.10),transparent 70%)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.2;font-weight:700;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
bdi,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.small{font-size:12.5px;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{display:block;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--bp-1),var(--bp-3));display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(13,67,160,.7)}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.15}
.brand span{font-size:12px;color:var(--ink-3)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2)}
.nav .lbl{font-size:12px;color:var(--ink-3);padding:16px 10px 5px;font-weight:700}
.nav .pj{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.ring{width:26px;height:26px}
.nav .pj small{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.badge{margin-inline-start:auto;font-size:11px;background:var(--na-bg);color:var(--na);padding:1px 7px;border-radius:99px}
.side .foot{margin-top:auto;padding:12px;border:1px solid var(--field-line);background:var(--field);border-radius:11px;font-size:12.5px;color:#6B5200;line-height:1.45}
.side .foot b{display:block;margin-bottom:2px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(10px)}
.crumb{font-size:13.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-family:var(--f-display);font-weight:500}
.search{flex:1;max-width:440px;margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink-3);font-size:14px;cursor:text}
.search kbd{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;background:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.demo{background:var(--field);color:#6B5200;border:1px solid var(--field-line)}
.page{padding:24px 28px 64px;max-width:1400px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:27px}
.phead p{margin:4px 0 0;color:var(--ink-2);max-width:64ch}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.card .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card .ch h3{font-size:16px}
.card .cb{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.mt{margin-top:16px}

/* ---------- hero (blueprint) ---------- */
.hero{position:relative;border-radius:20px;overflow:hidden;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);min-height:400px;
  background:linear-gradient(135deg,var(--bp-1) 0%,var(--bp-2) 58%,var(--bp-3) 100%);box-shadow:0 24px 50px -28px rgba(6,37,90,.8)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px}
.hero .txt{position:relative;padding:34px 36px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero .tag{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:700}
.hero h1{font-size:19px;font-weight:500;color:#CFE0FA;max-width:34ch}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:68px;letter-spacing:-2px;line-height:1;display:flex;align-items:baseline;gap:10px}
.hero .big small{font-size:26px;font-weight:500;color:#BBD3F7;letter-spacing:0}
.hero p{margin:0;color:#D6E4FB;max-width:46ch}
.hero .stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px;padding-top:16px;border-top:1px solid rgba(255,255,255,.22)}
.hero .stats div{font-size:12.5px;color:#BBD3F7}
.hero .stats b{display:block;font-family:var(--f-display);font-size:22px;color:#fff;font-weight:700}
.hero .view{position:relative;padding:26px 28px 26px 26px;display:grid;place-items:center}
.frame{position:relative;width:100%;border-radius:12px;background:#fff;box-shadow:0 30px 60px -24px rgba(0,0,0,.65),0 0 0 6px rgba(255,255,255,.14);overflow:hidden;aspect-ratio:1370/1078}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .scan{position:absolute;inset-inline:0;top:0;height:46%;background:linear-gradient(to bottom,transparent,rgba(31,111,209,.0) 40%,rgba(31,111,209,.38));border-bottom:2px solid var(--bp-3);transform:translateY(-100%);animation:scan 2.6s .4s cubic-bezier(.4,0,.2,1) 1 forwards}
@keyframes scan{to{transform:translateY(120%);opacity:0}}
.callout{position:absolute;background:rgba(14,27,43,.9);color:#fff;border-radius:9px;padding:6px 10px;font-size:12px;line-height:1.35;box-shadow:0 8px 18px -8px rgba(0,0,0,.6);white-space:nowrap}
.callout b{font-family:var(--f-display);font-weight:500;font-size:15px;display:block}
.callout::after{content:"";position:absolute;width:8px;height:8px;background:inherit;transform:rotate(45deg)}
.callout.c1{top:8%;inset-inline-start:4%}
.callout.c1::after{bottom:-4px;inset-inline-end:16px}
.callout.c2{bottom:7%;inset-inline-end:4%}
.callout.c2::after{top:-4px;inset-inline-start:16px}
.legend-mini{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(255,255,255,.94);border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--ink-2);display:flex;gap:10px;box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
.legend-mini i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2.5px solid;margin-inline-end:4px;vertical-align:-1px}

/* ---------- kpi ---------- */
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .row{display:flex;align-items:center;gap:10px}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)}
.kpi .k{font-size:13px;color:var(--ink-2);font-weight:700}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.6px;line-height:1.1;margin-top:6px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-3);margin-inline-start:4px;letter-spacing:0}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.mbar{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-top:8px;background:var(--na-bg)}
.mbar i{display:block;height:100%}

/* coverage swatches */
.c-full{background:var(--accent)}
.c-part{background:var(--accent-mid)}
.c-check{background:#CFE0F6;background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(31,111,209,.55) 3px 4px)}
.c-none{background:#E4E9F0;background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(95,107,120,.3) 4px 5px)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- project cards ---------- */
.proj{padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.proj:hover{transform:translateY(-2px);box-shadow:0 16px 34px -18px rgba(14,27,43,.35)}
.proj::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--pc)}
.proj .head{display:flex;gap:14px;align-items:center}
.proj h3{font-size:18px}
.proj .meta{font-size:13px;color:var(--ink-2)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pstats div{font-size:12px;color:var(--ink-3)}
.pstats b{display:block;font-size:17px;color:var(--ink);font-family:var(--f-display)}
.proj.new{background:repeating-linear-gradient(45deg,var(--sunk) 0 10px,#fff 10px 20px);justify-content:center;align-items:flex-start;border-style:dashed;border-color:var(--line-2)}
.proj.new::before{background:var(--villa)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:700;text-decoration:none;box-shadow:0 8px 16px -10px rgba(31,111,209,.9)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:none}

/* ---------- title block ---------- */
.tblock{display:grid;grid-template-columns:2.2fr 1.4fr 1fr 1fr 1fr 1.2fr;border:2px solid var(--ink);border-radius:4px;background:#fff;margin-bottom:16px}
.tblock div{padding:8px 12px;border-inline-start:1px solid var(--ink)}
.tblock div:first-child{border-inline-start:0}
.tblock small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.tblock b{font-family:var(--f-display);font-weight:500;font-size:15px}
.tblock .pn{background:var(--pcs);border-inline-end:5px solid var(--pc)}

/* ---------- tabs / seg ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);margin-bottom:16px;overflow:auto}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:14.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent-2);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}

/* ---------- treemap ---------- */
.tm{position:relative;direction:ltr;height:340px;border-radius:10px;overflow:hidden}
.tm .cell{position:absolute;border:2px solid var(--surface);border-radius:7px;padding:7px 8px;overflow:hidden;direction:rtl;font-size:12.5px;line-height:1.25;transition:filter .12s}
.tm .cell:hover{filter:brightness(.93)}
.tm .cell b{display:block;font-family:var(--f-display);font-weight:500}
.tm .cell.c-full,.tm .cell.c-full b{color:#fff}

/* ---------- waterfall ---------- */
.wf text{font-family:var(--f-body);fill:var(--ink-2);font-size:14px}
.wf .val{font-family:var(--f-mono);font-weight:500;fill:var(--ink);font-size:15px}
.wf .grid{stroke:var(--line);stroke-width:1}
.wf .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.12s + .3s)}
@keyframes grow{from{transform:scaleY(0)}}
.wf .bar:hover{filter:brightness(.92)}

/* ---------- variance bars ---------- */
.vrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) 62px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .t{font-size:13.5px;font-weight:600;line-height:1.25}
.vrow .p{font-size:11.5px;color:var(--ink-3);font-weight:400}
.vtrack{position:relative;height:22px;direction:ltr}
.vtrack::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.vtrack::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);z-index:0}
.vtrack i{position:absolute;top:5px;height:12px;border-radius:0 6px 6px 0;z-index:1;transition:filter .12s}
.vtrack i.neg{border-radius:6px 0 0 6px}
.vtrack i:hover{filter:brightness(.9)}
.vpct{font-family:var(--f-mono);font-size:13px;text-align:left;direction:ltr;font-weight:500}
.vaxis{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) 62px;gap:12px;font-size:11.5px;color:var(--ink-3);padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.vaxis .ax{display:flex;justify-content:space-between;direction:ltr}

/* ---------- chips / tables ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px 2px 8px;border-radius:99px;white-space:nowrap}
.s-gap{background:var(--gap-bg);color:var(--gap)}
.s-under{background:var(--under-bg);color:var(--under)}
.s-near{background:var(--near-bg);color:var(--near)}
.s-check,.s-na{background:var(--na-bg);color:var(--na)}
.s-info,.s-ok,.s-built{background:var(--ok-bg);color:var(--ok)}
.s-part{background:var(--near-bg);color:var(--near)}
.s-plan{background:var(--na-bg);color:var(--na)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12.5px;color:var(--ink-3);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--sunk);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--sunk);font-family:var(--f-display);font-weight:500;color:var(--ink-2);font-size:13px;padding:7px 12px}
tr.hl:hover td{background:#FAFCFF}
td.n{white-space:nowrap}
td.r{text-align:end}
.fsel{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:4px 6px;font-size:12.5px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink-2)}
.mvar{position:relative;display:inline-block;width:110px;height:14px;direction:ltr;vertical-align:middle}
.mvar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.mvar i{position:absolute;top:3px;height:8px}
.note{font-size:12.5px;color:var(--ink-3);max-width:44ch}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip span{font-family:var(--f-mono);margin-inline-start:6px;opacity:.7}

/* ---------- engines ---------- */
.eng{padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.eng h3{font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.eng p{margin:0;color:var(--ink-2);font-size:13.5px}
.eng .proof{font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.step{padding:14px 12px;border-inline-start:1px solid var(--line)}
.step:first-child{border-inline-start:0}
.step b{display:block;font-size:13.5px;font-family:var(--f-display);font-weight:500}
.step span{font-size:12px;color:var(--ink-3)}
.step .bar2{height:4px;border-radius:2px;margin-bottom:10px}

/* ---------- plan viewer ---------- */
.viewer{display:grid;grid-template-columns:268px minmax(0,1fr);gap:16px}
.thumbs{display:flex;flex-direction:column;gap:8px}
.thumb{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px;cursor:pointer}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.thumb img{width:78px;height:56px;object-fit:cover;border-radius:6px;background:#fff;border:1px solid var(--line)}
.thumb b{display:block;font-size:13.5px;font-family:var(--f-display);font-weight:500;line-height:1.25}
.thumb span{font-size:12px;color:var(--ink-3)}
.stage{position:relative;height:560px;background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.stage:active{cursor:grabbing}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;box-shadow:0 10px 40px -12px rgba(14,27,43,.35);background:#fff}
.ctl{position:absolute;inset-inline-end:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.ctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line-2);background:rgba(255,255,255,.95);display:grid;place-items:center;font-weight:700}
.vinfo{margin-top:12px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mets div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-3)}
.mets b{display:block;font-family:var(--f-display);font-size:19px;color:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;margin-inline-end:6px;vertical-align:-2px}
.lg i.sq{border-radius:3px;border-width:0}

/* ---------- misc ---------- */

#cmd .res a:hover,#cmd .res a.on{background:var(--accent-soft)}

.bnav{display:none}
.bars{display:flex;flex-direction:column;gap:10px}
.rb{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:12px;align-items:center}
.rb .tr{position:relative;height:22px;background:var(--na-bg);border-radius:6px;overflow:hidden;direction:ltr}
.rb .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:0 6px 6px 0}

@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .big{font-size:56px}.flow{grid-template-columns:repeat(2,1fr)}.step{border-inline-start:0;border-bottom:1px solid var(--line)}.tblock{grid-template-columns:repeat(3,1fr)}.tblock div{border-bottom:1px solid var(--ink)}.viewer,.vinfo{grid-template-columns:1fr}.thumbs{flex-direction:row;overflow:auto}.thumb{min-width:230px}}

}

<script>
const DATA = {{DATA}};
const IMGS = {{IMGS}};
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('he-IL');
const f1 = n => n==null?'—':(Math.abs(n)>=100?fmt(n):(+n.toFixed(1)).toLocaleString('he-IL'));
const money = n => n>=1e6 ? (n/1e6).toFixed(2).replace(/\.?0+$/,'')+' מיל׳' : n>=1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+' אלף' : fmt(n);
const bd = s => String(s).replace(/([+≈]?\d[\d,.]*%?(?:\s?[–-]\s?\+?\d[\d,.]*%?)?)/g,'<bdi dir="ltr">$1</bdi>');
const ta = s => String(s).replace(/"/g,'&quot;');
const COV = {full:'נמדד מהתוכניות', part:'נמדד בחלקו', check:'בקרה מול שטחים', none:'לא בשלב זה'};
const SEV = {gap:['עודף בכתב','M12 5v14M5 12l7 7 7-7'], under:['חסר בכתב','M12 19V5M5 12l7-7 7 7'], near:['פער קטן','M5 12h14'], check:['דורש נתון','M12 8v5M12 17h.01'], na:['דורש נתון','M12 8v5M12 17h.01'], info:['תואם','M5 13l4 4L19 7'], ok:['תואם','M5 13l4 4L19 7']};
const ST = {built:['בנוי','M5 13l4 4L19 7'], part:['חלקי','M5 12h14'], plan:['מתוכנן','M12 6v6l4 2']};
const ico = (d,s=18,w=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  chap:'<path d="M4 5h16M4 12h16M4 19h10"/>', eng:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', money:'<path d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 2.7 4 3 4 1.3 4 3-1.8 3-4 3-4-1.3-4-3"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>', doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  zi:'<path d="M12 5v14M5 12h14"/>', zo:'<path d="M5 12h14"/>', fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'
};
const chip = (cls,label,d) => `<span class="chip ${cls}">${ico(d,13,2.6)}${label}</span>`;
const sevChip = s => chip('s-'+s, SEV[s][0], SEV[s][1]);

/* ---------- catalog / engines (structure from Blue Book + Dekel; no prices) ---------- */
const CAT = [
 ['00','מוקדמות וכלליות','כללי'],['01','עבודות עפר','שלד'],['02','בטון יצוק באתר','שלד'],['03','רכיבים טרומיים','שלד'],['04','עבודות בנייה','שלד'],
 ['05','עבודות איטום','מעטפת'],['06','נגרות ומסגרות','גמרים'],['09','עבודות טיח','גמרים'],['10','ריצוף וחיפוי','גמרים'],['11','עבודות צבע','גמרים'],
 ['12','עבודות אלומיניום','מעטפת'],['14','עבודות אבן','גמרים'],['19','מסגרות חרש','גמרים'],['20','נגרות חרש וסיכוך','גמרים'],['22','רכיבים מתועשים','מעטפת'],
 ['23','כלונסאות','שלד'],['24','הריסות ופירוקים','שלד'],['07','מתקני תברואה','מערכות'],['08','מתקני חשמל','מערכות'],['15','מיזוג אוויר','מערכות'],
 ['17','מעליות','מערכות'],['18','תקשורת','מערכות'],['34','גילוי וכיבוי אש','מערכות'],['59','מרחבים מוגנים','שלד'],['40','פיתוח נופי','חוץ'],['41','גינון והשקיה','חוץ'],
 ['44','גדרות','חוץ'],['50','משטחי בטון','חוץ'],['51','כבישים ורחבות','חוץ'],['57','מים וביוב','חוץ']
];
const ENG_BY_CH = {'02':['בטון + ברזל','built'],'03':['טרומי','built'],'04':['בלוקים','part'],'23':['כלונסאות','built'],'06':['פריטים לפי תגיות','part'],'12':['פריטים לפי תגיות','built'],'19':['פריטים לפי תגיות','part'],'09':['גמרים לפי חדרים','part'],'10':['גמרים לפי חדרים','part'],'11':['גמרים לפי חדרים','part'],'22':['גמרים לפי חדרים','part'],'05':['איטום וגגות','plan'],'01':['עפר','plan'],'07':['תברואה','plan'],'08':['חשמל','plan'],'15':['מיזוג','plan']};
const ENGINES = [
 {n:'כלונסאות',ch:'23',st:'built',d:'מזהה עיגולים בשכבת הכלונסאות, קוטר לפי המרחק המרבי בין נקודות הקצה, ואורך מהתגית.',p:'חופים: 348 כלונסאות, Ø50–Ø70'},
 {n:'קירות ועמודים',ch:'02',st:'built',d:'קורא סימוני המשכה מתוכניות התקרה, ומחשב נפח לפי גובה קומה שנגזר מהמפלס.',p:'חופים: 720 מ"ק מול 1,007 בכתב'},
 {n:'תקרות ורצפות',ch:'02 · 03',st:'built',d:'שטח מקו מתאר, עובי מסימוני D=, חלוקת וורונוי סביב הסימונים והפחתת פתחים. טרומי לפי S_LOHAD.',p:'חופים: 3,527 מ"ר מול 5,375'},
 {n:'ברזל: קריאת טקסט מצויר',ch:'02',st:'part',d:'OCR וקטורי שמזהה כל אות לפי צורתה, בכל זווית. משקל לפי 0.00617·d² ק"ג למטר, והשלמת כיסוי לפי עיגולי סימון.',p:'כ-2,400 תוויות · כיסוי 81–85%'},
 {n:'קורות ובטון קטן',ch:'02',st:'built',d:'קורות, יסודות ורצפות מגיליונות הקונסטרוקציה, לפי עובי וגובה.',p:'אולגה: 21 קורות, 22.7 מ"ק'},
 {n:'בלוקים',ch:'04',st:'part',d:'שכבת הקירות באדריכלות. עדיין אי אפשר להפריד בלוק 20 מפומיס חוץ, כי העובי זהה בשרטוט.',p:'אולגה: 325 מ"ר'},
 {n:'פריטים לפי תגיות',ch:'06 · 12 · 19',st:'built',d:'אלומיניום, נגרות ומסגרות לפי תגיות, עם כללי ספירה (פריט כפול נספר פעם, תגית משני צידי קיר פעם).',p:'אולגה: 20 קבוצות פריטים'},
 {n:'גמרים לפי חדרים',ch:'09 · 10 · 11',st:'part',d:'זיהוי חדרים משכבת הקירות, חדרים רטובים, תקרות גבס ואקוסטיות. התוצאה רגישה להנחות (גובה טיח, קירות גלויים).',p:'אולגה: 9 סעיפי גמר'},
 {n:'קריאת כתב כמויות',ch:'כל הפרקים',st:'built',d:'מפענח כתב כמויות מ-PDF ומאקסל לסעיפים, יחידות ומחירים, ומשייך לפרק.',p:'3 כתבים · 2 פרויקטים'},
 {n:'זיהוי סוג גיליון',ch:'כללי',st:'part',d:'סוג (תקרה, קורות, ברזל, אדריכלות) ומפלס לפי אזור הכותרת. נבדק על גיליונות מהפרויקטים הקיימים בלבד.',p:'121 גיליונות'},
 {n:'חדרים, פתחים ושטחי וילה',ch:'09 · 10 · 11',st:'plan',d:'יתבסס על זיהוי החדרים הקיים ויורחב לווילה: פתחים, מדרגות, מרפסות וגגות משופעים.',p:'ממתין לתוכניות וילה'},
 {n:'תברואה וחשמל',ch:'07 · 08',st:'plan',d:'ספירת נקודות וקווים מגיליונות מערכות. עוד לא נבנה.',p:'ממתין לדוגמאות'},
 {n:'עפר ואיטום',ch:'01 · 05',st:'plan',d:'חפירה ומילוי מחתכים, ואיטום מגגות לפי שיפוע אמיתי.',p:'משימה פתוחה במסמך המערכת'},
 {n:'קריאת DWG ו-DWF',ch:'כל הפרקים',st:'plan',d:'קריאה ישירה מקובץ המתכנן. הדרך המדויקת ביותר, ועדיין לא בנויה.',p:'דגימות DWF נבדקו בתחילת העבודה'},
 {n:'תמחור וחשבונות',ch:'כל הפרקים',st:'plan',d:'מחירי קבלן וברזל, חשבונות חלקיים וכמויות בפועל מול חוזה.',p:'אחרי שהכמויות יציבות'},
];

/* ---------- data helpers ---------- */
const P = DATA.projects, PBY = Object.fromEntries(P.map(p=>[p.id,p]));
const PC = {olga:'#0E9384',hofim:'#5B5BD6'}, PCS = {olga:'#E3F5F2',hofim:'#ECECFB'};
const SHORT = {olga:'גן אולגה',hofim:'תיכון חופים'};
const pTot = p => p.chapters.reduce((a,c)=>a+c.v,0);
const pCov = p => { const t=pTot(p),o={full:0,part:0,check:0,none:0}; p.chapters.forEach(c=>o[c.cov]+=c.v); return Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v/t])); };
const covDone = p => { const c=pCov(p); return c.full+c.part+c.check; };
const allF = () => P.flatMap(p=>p.findings.map(f=>({...f,pid:p.id,pn:p.name})));
function devStatus(e,a){ if(e==null||a==null||a===0) return 'na'; const d=(e-a)/a; if(Math.abs(d)<=.05)return 'ok'; if(Math.abs(d)<=.15)return 'near'; return d<0?'gap':'under'; }
function rowsOf(p){
  const R=[];
  const add=(grp,n,u,e,a,b,s,note,extra)=>R.push({grp,n,u,e,a,b,s:(s||devStatus(e,a)),note:note||'',pid:p.id,extra});
  if(p.id==='olga'){
    p.concrete.forEach(r=>add('בטון (פרק 02)',r.n,r.u,r.e,r.a,r.b,null,r.note));
    p.masonry.forEach(r=>add('בנייה וריצוף (פרקים 04 · 10)',r.n,r.u,r.e,r.a,r.b,null,r.note));
  } else {
    const m=s=>['ok','near','gap','na'].includes(s)?s:null;
    p.walls.forEach(r=>add('קירות ועמודים (פרק 02)',r.n,'מ"ק',r.e,r.a,null,m(r.s),r.note));
    p.slabs.forEach(r=>add('תקרות ורצפות (פרקים 02 · 03)',r.n,'מ"ר',r.e,r.a,null,m(r.s),r.note));
    p.piles.forEach(r=>add('כלונסאות (פרק 23)',`Ø${r.dia} · מבנה ${r.b}`,'מ׳',r.m,r.boq,null,null,`${r.n} כלונסאות, תגית נקראה ב-${r.read}. ממוצע ${r.per} מ׳ לכלונס`));
  }
  return R;
}
const ALLROWS = P.flatMap(rowsOf);

/* ---------- tooltip ---------- */
const tip = $('#tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){tip.style.display='none';return}
  tip.innerHTML=t.dataset.tip; tip.style.display='block';
  const w=tip.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8)x=e.clientX-w-14; tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px';
});

/* ---------- charts ---------- */
function donut(c,size=92,label=true,sw=12){
  const R=size/2-sw/2-1,C=2*Math.PI*R, cols={full:'#1F6FD1',part:'#8DB8EE',check:'#B9D3F3',none:'#E4E9F0'};
  let off=0, segs='';
  ['full','part','check','none'].forEach(k=>{const l=c[k]*C; if(l>0)segs+=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${cols[k]}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,l-1.5)} ${C-Math.max(0,l-1.5)}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" data-tip="${COV[k]}: ${Math.round(c[k]*100)}%"/>`; off+=l;});
  const done=Math.round((c.full+c.part+c.check)*100);
  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}${label?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font-family:var(--f-display);font-weight:700;font-size:${size/4.4}px;fill:var(--ink)">${done}%</text>`:''}</svg>`;
}
function waterfall(items,total,title){
  const W=760,H=330,pl=44,pr=16,pt=34,pb=58, iw=W-pl-pr, ih=H-pt-pb, n=items.length+1, slot=iw/n, bw=Math.min(78,slot*.62);
  const mx=Math.ceil(total/1e6*2)/2*1e6 || total, y=v=>pt+ih-(v/mx)*ih, mm=v=>(+(v/1e6).toFixed(2)).toString();
  let g='',b='',cum=0;
  for(let t=0;t<=mx;t+=5e5){g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" style="font-size:11px;fill:var(--ink-3)">${t===0?'0':(t/1e6)+''}</text>`}
  g+=`<text x="${pl-8}" y="${pt-16}" text-anchor="end" style="font-size:11px;fill:var(--ink-3)">מיליון ₪</text>`;
  const col={gap:'var(--gap)',near:'var(--near-bar)',under:'var(--under)'};

function squarify(items,x,y,w,h){
  const total=items.reduce((a,i)=>a+i.v,0), k=w*h/total, arr=items.map(i=>({...i,a:i.v*k})), out=[];
  const worst=(row,s)=>{const sum=row.reduce((a,r)=>a+r.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(s*s*mx/(sum*sum),sum*sum/(s*s*mn))};
  function lay(row,x,y,w,h){const sum=row.reduce((a,r)=>a+r.a,0);
    if(w>=h){const rw=sum/h;let yy=y;row.forEach(r=>{const rh=r.a/rw;out.push({...r,x,y:yy,w:rw,h:rh});yy+=rh});return [x+rw,y,w-rw,h]}
    const rh=sum/w;let xx=x;row.forEach(r=>{const rw=r.a/rh;out.push({...r,x:xx,y,w:rw,h:rh});xx+=rw});return [x,y+rh,w,h-rh]}
  let row=[],rest=arr.slice();
  while(rest.length){const s=Math.min(w,h),n=rest[0];
    if(!row.length||worst([...row,n],s)<=worst(row,s)){row.push(n);rest.shift()}
    else{[x,y,w,h]=lay(row,x,y,w,h);row=[]}}

function setPlan(i){vSel=i;nav(true)}
function applyZ(){const im=$('#pimg'); if(im) im.style.transform=`translate(${vz.x}px,${vz.y}px) scale(${vz.s})`}
function fitPlan(){const st=$('#stage'),im=$('#pimg'); if(!st||!im)return; const w=st.clientWidth,h=st.clientHeight,iw=im.naturalWidth||1370,ih=im.naturalHeight||1078; im.style.width=iw+'px'; im.style.height=ih+'px'; const s=Math.min(w/iw,h/ih)*.96; vz={s,x:(w-iw*s)/2,y:(h-ih*s)/2}; applyZ()}
function zoomBy(f,cx,cy){const st=$('#stage'); if(!st)return; const r=st.getBoundingClientRect(); cx=cx==null?r.width/2:cx; cy=cy==null?r.height/2:cy; const ns=Math.max(.1,Math.min(8,vz.s*f)); vz.x=cx-(cx-vz.x)*(ns/vz.s); vz.y=cy-(cy-vz.y)*(ns/vz.s); vz.s=ns; applyZ()}
function bindStage(){
  const st=$('#stage'); if(!st)return; const im=$('#pimg');
  im.addEventListener('load',fitPlan); if(im.complete)fitPlan();
  let drag=null; const pts=new Map(); let pd=0;
  st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomBy(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  st.addEventListener('pointerdown',e=>{if(e.target.closest('.ctl'))return;st.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX-vz.x,y:e.clientY-vz.y};if(pts.size===2){const a=[...pts.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
  st.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),r=st.getBoundingClientRect();if(pd)zoomBy(d/pd,(a[0][0]+a[1][0])/2-r.left,(a[0][1]+a[1][1])/2-r.top);pd=d}
    else if(drag){vz.x=e.clientX-drag.x;vz.y=e.clientY-drag.y;applyZ()}});
  const up=e=>{pts.delete(e.pointerId);pd=0;drag=null};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
}
function countUp(){
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.cu').forEach(el=>{
    const v=parseFloat(el.dataset.v), d=el.dataset.d?+el.dataset.d:0, f=x=>d?x.toFixed(d):fmt(x);
    if(rm){el.textContent=f(v);return}
    const t0=performance.now(), dur=1100; (function step(t){const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=f(v*e); if(k<1)requestAnimationFrame(step)})(t0);
  });
}

/* ---------- command palette ---------- */
const CMD = () => [
  ...[['dash','לוח בקרה'],['chapters','פרקי הבנייה'],['engines','מנועי החישוב'],['new','פרויקט חדש: וילה']].map(([h,t])=>({t,s:'מסך',h:'#'+h})),
  ...P.flatMap(p=>[['overview','סקירה'],['compare','השוואת כמויות'],['rebar','ברזל'],['plans','תוכניות'],['findings','ממצאים']].map(([t,l])=>({t:SHORT[p.id]+' · '+l,s:'פרויקט',h:`#p-${p.id}-${t}`}))),
  ...CAT.map(c=>({t:`פרק ${c[0]} · ${c[1]}`,s:'פרק',h:'#chapters'})),
  ...ALLROWS.map(r=>({t:`${r.n} (${SHORT[r.pid]})`,s:'סעיף',h:`#p-${r.pid}-compare`})),
  ...allF().map(f=>({t:f.t.replace(/<[^>]+>/g,''),s:'ממצא',h:`#p-${f.pid}-findings`}))
];
let cmdIdx=0;
function openCmd(){$('#cmd').style.display='flex';$('#cin').value='';$('#cin').focus();renderCmd()}
function closeCmd(){$('#cmd').style.display='none'}
function renderCmd(){
  const q=$('#cin').value.trim(), all=CMD(), r=(q?all.filter(x=>x.t.includes(q)):all.slice(0,9)).slice(0,10); cmdIdx=0;
  $('#cres').innerHTML=r.map((x,i)=>`<a href="${x.h}" class="${i===0?'on':''}" onclick="closeCmd()">${x.t}<small>${x.s}</small></a>`).join('')||'<div class="small" style="padding:14px">לא נמצאו תוצאות</div>';
}
$('#sbtn').addEventListener('click',openCmd);
$('#cin').addEventListener('input',renderCmd);
$('#cmd').addEventListener('click',e=>{if(e.target.id==='cmd')closeCmd()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openCmd()}
  else if(e.key==='Escape')closeCmd();
  else if($('#cmd').style.display==='flex'&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter')){
    const a=[...document.querySelectorAll('#cres a')]; if(!a.length)return; e.preventDefault();
    if(e.key==='Enter'){a[cmdIdx].click();return}
    cmdIdx=(cmdIdx+(e.key==='ArrowDown'?1:-1)+a.length)%a.length; a.forEach((x,i)=>x.classList.toggle('on',i===cmdIdx));
  }
});

/* ---------- router ---------- */
function nav(keep){
  const h=(location.hash||'#dash').slice(1);
  let id='dash', tab=null, pid=null, html;
  const m=h.match(/^p-(olga|hofim)-(overview|compare|rebar|plans|findings)$/);
  if(m){id='project';pid=m[1];tab=m[2];html=SCREENS.project(pid,tab)}
  else {id=SCREENS[h]&&h!=='project'?h:'dash';html=SCREENS[id]()}
  const items=[['dash','לוח בקרה',I.dash,'#dash'],['chapters','פרקים',I.chap,'#chapters'],['engines','מנועים',I.eng,'#engines'],['new','וילה חדשה',I.plus,'#new']];
  const crumbs={dash:['לוח בקרה'],chapters:['פרקים'],engines:['מנועים'],new:['פרויקט חדש']}[id]||[SHORT[pid],{overview:'סקירה',compare:'השוואת כמויות',rebar:'ברזל',plans:'תוכניות',findings:'ממצאים'}[tab]];
  $('#crumb').innerHTML=`<span>מנוע כמויות</span>${ico('<path d="M15 6l-6 6 6 6"/>',14,2)}`+crumbs.map((c,i)=>i===crumbs.length-1?`<b>${c}</b>`:`<span>${c}</span>${ico('<path d="M15 6l-6 6 6 6"/>',14,2)}`).join('');
  $('#side').innerHTML=`<div class="brand"><div class="logo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10l8-6 8 6v10"/><path d="M9 20v-6h6v6"/></svg></div><div><b>מנוע כמויות</b><span>מתוכניות לכתב כמויות</span></div></div>
   <nav class="nav">${items.map(i=>`<a href="${i[3]}" class="${i[0]===id?'on':''}">${ico(i[2],18)}${i[1]}</a>`).join('')}
   <div class="lbl">פרויקטים</div>${P.map(p=>`<a href="#p-${p.id}-overview" class="${pid===p.id?'on':''}"><span class="pj">${donut(pCov(p),26,false,6).replace('class="donut"','class="ring"')}<span>${SHORT[p.id]}</span><small>${Math.round(covDone(p)*100)}%</small></span></a>`).join('')}
   <a href="#new"><span class="pj"><i style="width:26px;display:grid;place-items:center"><i style="width:10px;height:10px;border-radius:50%;background:var(--villa)"></i></i><span>וילה</span><span class="badge">חדש</span></span></a></nav>
   <div class="foot"><b>מצב: דמו לאישור</b>עוד לא מוטמע במפלס. כל שינוי נבנה בנפרד ורק אחרי אישור.</div>`;
  const bn=[['dash','לוח בקרה',I.dash,'#dash'],['olga','אולגה',I.layers,'#p-olga-overview'],['hofim','חופים',I.layers,'#p-hofim-overview'],['engines','מנועים',I.eng,'#engines'],['new','וילה',I.plus,'#new']];
  $('#bnav').innerHTML=bn.map(i=>`<a href="${i[3]}" class="${(i[0]===id||i[0]===pid)?'on':''}">${ico(i[2],21)}${i[1]}</a>`).join('');
  $('#page').innerHTML=html;
  document.querySelectorAll('table.resp td').forEach(td=>{td.innerHTML='<span class="v">'+td.innerHTML+'</span>'});
  if($('#tm')){ if(pid)tmP=pid; drawTM(); }
  bindStage();
  document.querySelectorAll('.fsel').forEach(s=>{try{const v=localStorage.getItem(s.dataset.k);if(v)s.value=v}catch(e){}});
  if(keep!==true){scrollTo(0,0);countUp()} else document.querySelectorAll('.cu').forEach(el=>{const v=parseFloat(el.dataset.v),d=el.dataset.d?+el.dataset.d:0;el.textContent=d?v.toFixed(d):fmt(v)});
}
addEventListener('hashchange',()=>nav());
nav();
</script>
