<title>מערכת כתבי כמויות</title>
<style>
@font-face{font-family:'Rubik';font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/rubik-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}

@font-face{font-family:'Rubik';font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/rubik-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Assistant';font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/assistant-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Assistant';font-weight:600;font-style:normal;font-display:swap;src:url(/fonts/assistant-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}

@font-face{font-family:'Assistant';font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/assistant-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:light;--bg:#EEF2F7;--card:#fff;--sunk:#F6F8FB;--ink:#0E1B2B;--mut:#74839A;--line:#E0E6EF;--pri:#174F96;--pri2:#1F6FD1;--accsoft:#E6F0FC;--acc:#D9622B;--accb:#FCEEE6;--ok:#1C8248;--okb:#E1F3E8;--warn:#946300;--warnb:#FBF0D3;--bad:#C0392B;--badb:#FBE5E2;--bp1:#06255A;--bp2:#0D43A0;--bp3:#1F6FD1;--r:14px;--sh:0 1px 2px rgba(14,27,43,.05),0 8px 24px -12px rgba(14,27,43,.14);--fd:"Rubik","Assistant",system-ui,sans-serif;--fb:"Assistant","Rubik",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);color:#43536A;border-inline-start:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:6px 10px 18px;font-weight:700;font-size:18px;color:var(--ink)}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--bp2),var(--bp3));display:grid;place-items:center;font-style:normal;color:#fff}
.nav a{display:flex;gap:10px;align-items:center;padding:12px 12px;border-radius:10px;color:#43536A;text-decoration:none;min-height:46px;font-weight:600}
.nav a:hover{background:var(--sunk)}.nav a.on{background:var(--accsoft);color:var(--pri)}
.nav .sep{font-size:12px;color:var(--mut);padding:14px 12px 4px}
.pname{margin:4px 10px 8px;padding:10px 12px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink);font-weight:700}
.main{padding:26px 30px 60px;max-width:1400px;width:100%;min-width:0}.app>*{min-width:0}.scroll table{min-width:760px}
h1,h2,.logo,.n,.big{font-family:var(--fd)}h1{font-size:26px;margin:0 0 4px;font-weight:700}h2{font-size:18px;margin:0 0 12px;font-weight:700}.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g2>.grid{align-content:start}.kpi .n{font-size:30px;font-weight:800;letter-spacing:-.5px}.kpi .l{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--acc))}
.btn{border:0;background:var(--pri2);color:#fff;padding:11px 18px;border-radius:10px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}.btn.ok{background:var(--ok)}.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px;width:100%}
input.num{width:100px;text-align:left;direction:ltr}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.ch td{background:color-mix(in srgb,var(--pri) 10%,var(--card));font-weight:800}tr.sub td{font-weight:700;color:var(--pri)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);direction:ltr;text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.t-ok{background:var(--okb);color:var(--ok)}.t-w{background:var(--warnb);color:var(--warn)}.t-b{background:var(--badb);color:var(--bad)}
.scroll{overflow:auto;max-height:68vh;border-radius:10px}
.drop{border:2px dashed var(--pri2);border-radius:var(--r);padding:34px;text-align:center;background:color-mix(in srgb,var(--pri2) 6%,var(--card));cursor:pointer}
.drop.over{background:color-mix(in srgb,var(--pri2) 18%,var(--card))}
.brain{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,var(--bp1),var(--bp3));color:#fff;border:0}
.brain .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;flex:none}
.brain li{margin:3px 0}.brain ul{padding-inline-start:18px;margin:6px 0}
.need{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.need:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}.d-high{background:var(--bad)}.d-med{background:var(--acc)}.d-low{background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.toast{position:fixed;bottom:22px;left:22px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.proj{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.proj:hover{border-color:var(--pri2)}
.empty{text-align:center;color:var(--mut);padding:40px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:1024px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:5;padding:6px;overflow-x:auto;border-top:1px solid var(--line)}
.logo,.pname,.nav .sep{display:none}.nav{display:flex;gap:2px;width:100%}.nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-height:54px;white-space:nowrap;justify-content:center}
.main{padding:18px 16px 100px}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}

.steps{display:flex;gap:0;margin:0 0 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.steps a{flex:1;padding:12px 14px;text-decoration:none;color:var(--mut);display:flex;gap:10px;align-items:center;border-inline-start:1px solid var(--line);font-weight:600;min-height:52px}
.steps a:first-child{border:0}.steps a b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:13px;flex:none}
.steps a.done b{background:var(--ok);color:#fff}.steps a.now{color:var(--ink);background:color-mix(in srgb,var(--pri2) 9%,var(--card))}.steps a.now b{background:var(--pri2);color:#fff}
.drop{display:block;padding:46px 24px;transition:.15s}.drop .big{font-size:42px;line-height:1}.drop:hover{transform:translateY(-1px)}
.prog{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:14px}.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri2),var(--acc));transition:width .2s}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.sh{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.sh .im{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;cursor:zoom-in;border-bottom:1px solid var(--line)}.sh .im img{max-width:100%;max-height:100%;object-fit:contain}
.sh .bd{padding:10px 12px;display:grid;gap:8px}.sh .fn{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.lb{position:fixed;inset:0;background:#000c;z-index:20;display:grid;place-items:center;padding:20px;cursor:zoom-out}.lb img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.menu{position:relative;display:inline-block}.menu .mi{display:none;position:absolute;inset-inline-end:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:230px;box-shadow:0 12px 40px rgba(15,27,61,.2);z-index:6;overflow:hidden}
.menu.open .mi{display:block}.menu .mi a,.menu .mi button{display:block;width:100%;text-align:right;padding:12px 16px;border:0;background:none;color:var(--ink);text-decoration:none;cursor:pointer;min-height:44px}.menu .mi a:hover,.menu .mi button:hover{background:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600}.chip.on{background:var(--pri2);color:#fff;border-color:var(--pri2)}
tr.ch{cursor:pointer}tr.hid{display:none}tr.m td{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}.x:hover{background:var(--badb);color:var(--bad)}
.ring{--v:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--pri2) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;flex:none}.ring i{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px}
.builder{border:2px solid color-mix(in srgb,var(--acc) 50%,var(--line));background:color-mix(in srgb,var(--acc) 5%,var(--card))}
.fld{display:grid;gap:4px}.fld label{font-size:12px;color:var(--mut);font-weight:600}
@media(max-width:1024px){.steps a{flex-direction:column;gap:4px;justify-content:center;padding:8px 2px;font-size:12px;text-align:center}}
@media print{.steps,.menu,.chips,.builder,.x{display:none!important}.scroll{max-height:none!important;overflow:visible}body{background:#fff}}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--bp1),var(--bp2) 55%,var(--bp3));background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(135deg,var(--bp1),var(--bp2) 55%,var(--bp3));background-size:36px 36px,36px 36px,100% 100%;color:#fff;margin-bottom:16px;box-shadow:var(--sh)}
.hero .im{background:#fff;padding:14px;display:grid;place-items:center;min-height:260px}.hero .im img{max-width:100%;max-height:300px;object-fit:contain}
.hero .tx{padding:26px 30px}.hero .big{font-size:46px;font-weight:800;letter-spacing:-1px;margin:6px 0}.hero .st{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}.hero .st b{display:block;font-size:24px}.hero .st span{font-size:12px;opacity:.8}
.hero .pill{display:inline-block;background:#ffffff26;padding:4px 12px;border-radius:20px;font-size:12px;margin-bottom:8px}
.tm{position:relative;height:340px;border-radius:12px;overflow:hidden;background:var(--line)}.tm div{position:absolute;padding:8px 10px;color:#fff;font-size:12px;line-height:1.3;overflow:hidden;border:2px solid var(--card);border-radius:6px;cursor:pointer}.tm div b{display:block;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.donut{display:block}.pcard{display:flex;gap:16px;align-items:center;cursor:pointer}.pcard:hover{border-color:var(--pri2)}
@media(max-width:1024px){.hero{grid-template-columns:1fr}.hero .big{font-size:36px}}
@media print{.side,.btn{display:none}.app{display:block}}
</style>

<body>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=2)=>n==null?'':Number(n).toLocaleString('he-IL',{maximumFractionDigits:d});
const money=n=>'₪'+nf(n,0);
const bl=s=>esc(s).replace(/([A-Za-z0-9][A-Za-z0-9.\-_\/]*)/g,'<bdi dir="ltr">$1</bdi>');
let TYPES={},PARAMS={},P=null,SUM=null,busy=false;
async function api(path,opt={}){
  const r=await fetch('/api'+path,opt.body instanceof FormData||opt.method==='GET'||!opt.body?opt:{...opt,headers:{'content-type':'application/json'},body:JSON.stringify(opt.body)});
  if(!r.ok){let m='שגיאה';try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
  return r.json()}
function toast(t){const e=$('#toast');e.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>e.innerHTML='',3500)}
const R=()=>{const h=location.hash.replace('#/','').split('/');return{pid:h[0]==='p'?h[1]:null,page:h[0]==='p'?(h[2]||'dash'):(['spec','engines','legacy'].includes(h[0])?h[0]:'projects')}};

function side(){
  const {pid,page}=R();const l=(p,i,t)=>`<a href="#/p/${pid}/${p}" class="${page===p?'on':''}"><span>${i}</span>${t}</a>`;
  $('#side').innerHTML=`<div class="logo"><i>▦</i>כתבי כמויות</div><nav class="nav">
  <a href="#/" class="${!pid&&page==='projects'?'on':''}"><span>◫</span>לוח בקרה</a><a href="#/spec" class="${page==='spec'?'on':''}"><span>❖</span>ספר המפרט</a><a href="#/engines" class="${page==='engines'?'on':''}"><span>⚙</span>מנועי חישוב</a><a href="#/legacy" class="${page==='legacy'?'on':''}"><span>▥</span>ספריית אימון</a>
  ${pid?`<div class="pname">${esc(P?.name||'')}</div><div class="sep">הפרויקט</div>
  ${l('dash','◉','לוח בקרה')}${l('plans','▤','תוכניות')}${l('boq','☰','כתב כמויות')}${l('materials','▣','חומרים והזמנות')}${l('bills','₪','חשבונות')}${l('brain','✦','המוח')}`:''}</nav>`}

async function render(){
  const {pid,page}=R();
  if(pid){try{P=await api('/projects/'+pid);SUM=await api(`/projects/${pid}/summary`)}catch(e){location.hash='#/';return}}else P=null;
  side();
  const v={projects,dash,plans,boq,materials,bills,brain,spec,engines,legacy}[page]||dash;
  $('#main').innerHTML='<div class="empty">טוען…</div>';
  $('#main').innerHTML=(pid?stepper(page):'')+await v();
  if(window['after_'+page])window['after_'+page]();
}
window.addEventListener('hashchange',render);

function stepper(page){
  const S=SUM,st=[['plans','תוכניות',P.sheets.length>0],['boq','כתב כמויות',!!P.boq],['price','תמחור',S.priced>0],['materials','חומרים והזמנות',S.orders>0],['bills','חשבונות',S.bills>0]];
  const cur=st.findIndex(x=>!x[2]);const href={plans:'plans',boq:'boq',price:'boq',materials:'materials',bills:'bills'};
  return `<div class="steps">${st.map((x,i)=>`<a href="#/p/${P.id}/${href[x[0]]}" class="${x[2]?'done':''} ${i===cur?'now':''}"><b>${x[2]?'✓':i+1}</b><span>${x[1]}</span></a>`).join('')}</div>`}
function menu(items){return `<div class="menu"><button class="btn sec" onclick="this.parentNode.classList.toggle('open');event.stopPropagation()">ייצוא ▾</button><div class="mi">${items}</div></div>`}
document.addEventListener('click',()=>document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')));
function csv(rows,name){const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}
function boqCsv(){csv([['מספר','תיאור','יחידה','כמות','מחיר','סהכ'],...P.boq.map(r=>r.kind==='item'?[r.code,r.desc,r.unit,r.q??'',P.prices[r.code]??'',r.q&&P.prices[r.code]?r.q*P.prices[r.code]:'']:[r.code,r.desc,'','','',''])],'boq.csv')}
function matCsv(){csv([['חומר','יחידה','כמות','מחיר','סהכ'],...P.materials.map(m=>[m.material,m.unit,m.qty,P.mprices[m.material]??'',P.mprices[m.material]?m.qty*P.mprices[m.material]:''])],'materials.csv')}
function treemap(items,w,hh){ // items: [{k,w,c,t,s}] slice-and-dice by weight, largest first
  const out=[];const tot=items.reduce((a,i)=>a+i.w,0)||1;
  (function lay(arr,x,y,W,H,vert){if(!arr.length)return;if(arr.length===1){out.push({...arr[0],x,y,W,H});return}

  <div class="row" style="margin-bottom:14px"><div class="chips">${[['all','הכל'],['miss','חסר כמות'],['part','חלקי'],['ok','עם כמות'],['priced','מתומחר']].map(([k,t])=>`<span class="chip ${FLT===k?'on':''}" onclick="setFlt('${k}')">${t}</span>`).join('')}</div><span class="sp"></span>
   <button class="btn sec" onclick="document.getElementById('bld').scrollIntoView({behavior:'smooth'})">+ הוסף סעיף</button><button class="btn sec" onclick="suggestAll()">הצע מחירים מהזיכרון</button><button class="btn sec" onclick="remember()">שמור מחירים לזיכרון</button>
   ${menu(`<a href="/api/projects/${P.id}/export.xlsx">כתב כמויות (Excel)</a><a href="/api/projects/${P.id}/quote.xlsx">הצעת מחיר (Excel)</a><button onclick="boqCsv()">כתב כמויות (CSV)</button><button onclick="window.print()">הדפסה / PDF</button>`)}</div>
  <div class="card"><div class="scroll"><table><tr><th>מספר</th><th>תיאור</th><th>יח'</th><th>כמות</th><th>מחיר</th><th>סה"כ</th><th>מקור</th><th></th></tr>${tr}</table></div>
  <div class="row" style="margin-top:14px;font-size:18px"><span class="sub" style="margin:0;font-size:13px">${hid.length?`${hid.length} סעיפים מוסתרים · <a href="#" onclick="unhideAll();return false">החזר הכל</a>`:''}</span><span class="sp"></span><b>סה"כ מתומחר: ${money(SUM.total)}</b></div></div>
  <div class="card builder" id="bld" style="margin-top:16px"><h2>בנאי: הוספת סעיף</h2><div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
   <div class="fld"><label>פרק</label><select id="b-ch" onchange="document.getElementById('b-new').style.display=this.value==='new'?'grid':'none'">${chs.map(c=>{const[n,d]=c.split('|');return `<option value="${+n}">${n} · ${esc(d)}</option>`}).join('')}<option value="new">+ פרק חדש…</option></select></div>
   <div class="fld" id="b-new" style="display:none"><label>מספר ושם פרק חדש</label><div class="row"><input id="b-cn" class="num" style="width:70px" placeholder="50"><input id="b-cname" placeholder="שם הפרק"></div></div>
   <div class="fld" style="grid-column:span 2"><label>תיאור הסעיף</label><input id="b-desc" placeholder="למשל: ריצוף אבן טבעית בחדרי רחצה"></div>
   <div class="fld"><label>יחידה</label><select id="b-unit">${['מ"ר','מטר','יח\'','מ"ק','טון','ק"ג','קומפ\'','נק\'','שעה','ליטר'].map(u=>`<option>${u}</option>`).join('')}</select></div>
   <div class="fld"><label>כמות</label><input id="b-q" class="num" style="width:100%" placeholder="אפשר להשאיר ריק"></div></div>
   <button class="btn" style="margin-top:12px" onclick="addItem()">הוסף לכתב</button></div>
  <details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">הנחות החישוב (משנים וכל הכתב מחושב מחדש)</summary><div class="grid g4" style="margin-top:12px">${prm}</div><button class="btn" style="margin-top:12px" onclick="saveParams()">שמור וחשב מחדש</button></details>`}
window.after_boq=()=>applyFlt();
function applyFlt(){document.querySelectorAll('tr[data-in]').forEach(r=>{let hide=!!COLL[r.dataset.in];if(!hide&&FLT!=='all'&&r.dataset.st){const st=r.dataset.st;hide=!(FLT===st||(FLT==='ok'&&(st==='ok'||st==='priced'||st==='part')))}if(!hide&&FLT!=='all'&&!r.dataset.st)hide=true;r.classList.toggle('hid',hide)})}
function setFlt(k){FLT=k;render()}
function toggleCh(c){COLL[c]=!COLL[c];$('#ar-'+c).textContent=COLL[c]?'◂':'▾';applyFlt()}
async function bld(b){P=await api(`/projects/${P.id}/builder`,{method:'POST',body:b});render()}
function setQty(i,v){bld({action:'qty',desc:P.boq[i].desc,q:v})}
async function rmItem(i){const d=P.boq[i].desc;if((P.manual||[]).some(m=>m.desc===d))await bld({action:'rm_manual',desc:d});else await bld({action:'hide',desc:d});toast('הוסר מהכתב')}
async function unhideAll(){for(const d of P.hidden)await api(`/projects/${P.id}/builder`,{method:'POST',body:{action:'unhide',desc:d}});render()}
async function addItem(){const c=$('#b-ch').value,nw=c==='new';const b={action:'add',ch:nw?$('#b-cn').value:c,desc:$('#b-desc').value,unit:$('#b-unit').value,q:$('#b-q').value};if(nw)b.chname=$('#b-cname').value;
  try{await bld(b);toast('הסעיף נוסף')}catch(e){toast(e.message)}}
async function setPrice(i){await api(`/projects/${P.id}/prices`,{method:'POST',body:{items:{[i.dataset.c]:i.value}}});render()}
async function remember(){await api(`/projects/${P.id}/prices`,{method:'POST',body:{items:{},remember:true}});toast('המחירים נשמרו בזיכרון המערכת ויוצעו בפרויקטים הבאים')}
async function suggestAll(){const s=await api(`/projects/${P.id}/suggest`,{method:'POST'});const ks=Object.keys(s);if(!ks.length){toast('אין הצעות מתאימות בזיכרון עדיין');return}
  ks.forEach(k=>{const e=$('#s-'+k);if(e)e.innerHTML=`<div><button class="btn sm sec" onclick="takeSug('${k}',${s[k].price})">₪${s[k].price} · התאמה ${s[k].match}% — החל</button></div>`});toast(`${ks.length} הצעות`)}
async function takeSug(k,p){await api(`/projects/${P.id}/prices`,{method:'POST',body:{items:{[k]:p}}});render()}
async function saveParams(){const b={};Object.keys(PARAMS).forEach(k=>b[k]=$('#pp-'+k).value);await api(`/projects/${P.id}/params`,{method:'POST',body:b});await api(`/projects/${P.id}/run`,{method:'POST'});toast('חושב מחדש');render()}

/* ---------- materials & orders ---------- */
async function materials(){
  if(!P.materials.length)return `<h1>חומרים והזמנות</h1><div class="card empty">אחרי חישוב כתב הכמויות, כאן יופיע פירוק לחומרים להזמנה.</div>`;
  const rows=P.materials.map((m,i)=>`<tr><td><input type="checkbox" class="ck" data-i="${i}" checked></td><td><b>${esc(m.material)}</b><div class="code" style="text-align:right">${m.codes.slice(0,4).join(' · ')}</div></td><td>${esc(m.unit)}</td><td><input class="num" id="q${i}" value="${m.qty}"></td>
   <td><input class="num" value="${P.mprices[m.material]??''}" placeholder="מחיר" onchange="setMp('${esc(m.material)}',this.value)"></td><td>${P.mprices[m.material]?money(m.qty*P.mprices[m.material]):''}</td></tr>`).join('');
  const tot=P.materials.reduce((a,m)=>a+(P.mprices[m.material]?m.qty*P.mprices[m.material]:0),0);
  const os=P.orders.map(o=>`<tr><td>#${o.n}</td><td>${esc(o.supplier)}</td><td>${o.items.length} חומרים</td><td>${esc(o.needed||'-')}</td>
   <td><select onchange="ostat(${o.n},this.value)">${['טיוטה','נשלחה','סופקה חלקית','סופקה','בוטלה'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><a class="btn sm sec" href="/api/projects/${P.id}/orders/${o.n}.xlsx">הורד</a></td></tr>`).join('');
  return `<h1>חומרים והזמנות</h1><p class="sub">כתב הכמויות מפורק לחומרים לפי מתכוני ביצוע, כולל פחת. בוחרים מה להזמין ומפיקים הזמנת רכש.</p>
  <div class="card"><div class="scroll"><table><tr><th></th><th>חומר</th><th>יח'</th><th>כמות להזמנה</th><th>מחיר</th><th>סה"כ</th></tr>${rows}</table></div>
  <div class="row" style="margin-bottom:12px"><span class="sp"></span>${menu(`<button onclick="matCsv()">רשימת חומרים (CSV)</button><button onclick="window.print()">הדפסה / PDF</button>`)}</div><div class="row" style="margin-top:14px"><input id="sup" placeholder="שם ספק" style="max-width:220px"><input id="need" type="date" style="max-width:170px" title="תאריך אספקה"><input id="note" placeholder="הערה לספק" style="max-width:260px"><span class="sp"></span><b>${money(tot)}</b><button class="btn ok" onclick="mkOrder()">הפק הזמנת רכש</button></div></div>
  <div class="card" style="margin-top:16px"><h2>הזמנות שנוצרו</h2>${P.orders.length?`<table><tr><th>#</th><th>ספק</th><th>פריטים</th><th>אספקה</th><th>סטטוס</th><th></th></tr>${os}</table>`:'<div class="empty">עוד אין הזמנות</div>'}</div>`}
async function setMp(m,v){await api(`/projects/${P.id}/prices`,{method:'POST',body:{materials:{[m]:v}}});render()}
async function mkOrder(){const items=[...document.querySelectorAll('.ck')].filter(c=>c.checked).map(c=>{const m=P.materials[c.dataset.i];return{material:m.material,unit:m.unit,qty:$('#q'+c.dataset.i).value}});
  try{await api(`/projects/${P.id}/orders`,{method:'POST',body:{items,supplier:$('#sup').value,needed:$('#need').value,note:$('#note').value}});toast('ההזמנה נוצרה');render()}catch(e){toast(e.message)}}
async function ostat(n,s){await api(`/projects/${P.id}/orders/${n}`,{method:'POST',body:{status:s}});toast('עודכן')}

/* ---------- bills ---------- */
async function bills(){
  if(!P.boq)return `<h1>חשבונות</h1><div class="card empty">צריך כתב כמויות מתומחר.</div>`;
  const prev=P.bills.length?P.bills[P.bills.length-1].pct:{};
  const items=P.boq.filter(r=>r.kind==='item'&&r.q&&P.prices[r.code]);
  const rows=items.map(r=>`<tr><td class="code">${r.code}</td><td>${esc(r.desc)}</td><td>${money(r.q*P.prices[r.code])}</td><td>${nf(prev[r.code]||0,0)}%</td><td><input class="num" data-b="${r.code}" value="${prev[r.code]||0}" style="width:80px"> %</td></tr>`).join('');
  const list=P.bills.map(b=>`<tr><td>חשבון ${b.n}</td><td>${b.date}</td><td>${money(b.this)}</td><td>${money(b.retention)}</td><td>${money(b.vat)}</td><td><b>${money(b.total)}</b></td></tr>`).join('');
  return `<h1>חשבונות חלקיים</h1><p class="sub">מזינים אחוז ביצוע מצטבר לכל סעיף. המערכת מחשבת חלק החשבון הנוכחי, עיכבון ומע"מ.</p>
  <div class="card"><h2>חשבון חדש</h2>${items.length?`<div class="scroll"><table><tr><th>מספר</th><th>סעיף</th><th>שווי</th><th>קודם</th><th>מצטבר עכשיו</th></tr>${rows}</table></div><button class="btn" style="margin-top:12px" onclick="mkBill()">הפק חשבון</button>`:'<div class="empty">אין סעיפים מתומחרים. מלא מחירים בלשונית כתב כמויות.</div>'}</div>
  <div class="card" style="margin-top:16px"><h2>חשבונות שהוגשו</h2>${P.bills.length?`<table><tr><th>חשבון</th><th>תאריך</th><th>לחשבון זה</th><th>עיכבון</th><th>מע"מ</th><th>סה"כ לתשלום</th></tr>${list}</table>`:'<div class="empty">עוד לא הוגש חשבון</div>'}</div>`}
async function mkBill(){const pct={};document.querySelectorAll('[data-b]').forEach(i=>pct[i.dataset.b]=i.value);
  const b=await api(`/projects/${P.id}/bills`,{method:'POST',body:{pct}});toast(`חשבון ${b.n}: ${money(b.total)} לתשלום`);render()}

/* ---------- spec book ---------- */
let SPECQ='',SPECCH='';
async function spec(){
  const d=await api('/spec');const q=SPECQ.trim();
  const items=d.items.filter(i=>(!SPECCH||String(i.ch)===SPECCH)&&(!q||(i.desc+i.method+i.unit).includes(q)));
  const used=[...new Set(d.items.map(i=>i.ch))];
  const eng=d.items.filter(i=>i.eng).length,ver=d.items.filter(i=>i.src==='v').length;
  return `<h1>ספר המפרט</h1><p class="sub">בסיס הידע של המערכת: פרקים, סעיפים, יחידות מידה ואופן המדידה. כך המערכת יודעת מה למדוד מהתוכנית ואיך להציג את התוצאה.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px"><div class="card kpi"><div class="n">${Object.keys(d.chapters).length}</div><div class="l">פרקים ברשימה הרשמית</div></div><div class="card kpi"><div class="n">${d.items.length}</div><div class="l">סעיפים עם יחידה ואופן מדידה</div></div><div class="card kpi"><div class="n">${ver}</div><div class="l">כללים שאומתו ממקור שפורסם</div></div><div class="card kpi"><div class="n">${eng}</div><div class="l">סעיפים שהמערכת כבר מחשבת מהתוכנית</div></div></div>
  <div class="card"><div class="row" style="margin-bottom:12px"><input id="sq" placeholder="חיפוש סעיף, יחידה או אופן מדידה" value="${esc(SPECQ)}" style="max-width:340px" onchange="SPECQ=this.value;render()"><select style="max-width:280px" onchange="SPECCH=this.value;render()"><option value="">כל הפרקים</option>${used.map(c=>`<option value="${c}" ${String(c)===SPECCH?'selected':''}>${String(c).padStart(2,'0')} · ${esc(d.chapters[c])}</option>`).join('')}</select></div>
  <div class="scroll"><table><tr><th>פרק</th><th>סעיף</th><th>יח'</th><th>אופן המדידה</th><th>תוצאה</th><th>מקור</th><th>חישוב אוטומטי</th></tr>
  ${items.map(i=>`<tr><td class="code">${String(i.ch).padStart(2,'0')}</td><td><b>${esc(i.desc)}</b><div class="sub" style="margin:0;font-size:12px">${esc(d.chapters[i.ch])}</div></td><td>${esc(i.unit)}</td><td>${esc(i.method)}</td><td style="font-size:13px">${esc(i.result)}</td><td><span class="tag ${i.src==='v'?'t-ok':'t-w'}">${i.src==='v'?'מאומת':'לאימות'}</span></td><td>${i.eng?'<span class="tag t-ok">פעיל</span>':'<span class="tag t-b">עוד לא</span>'}</td></tr>`).join('')}</table></div></div>
  <p class="sub" style="margin-top:14px">שמות הפרקים לפי רשימת הפרקים של המפרט הכללי לעבודות בנייה. "מאומת" אומר שהכלל נמצא במסמך שפורסם. "לאימות" הוא כלל מקובל בענף שיש לבדוק מול נוסח הספר הכחול העדכני לפני הסתמכות בחשבון סופי.</p>`}

/* ---------- engines & legacy ---------- */
async function engines(){
  const E=await api('/engines');const L={active:['t-ok','פעיל'],partial:['t-w','חלקי'],estimate:['t-w','הערכה'],todo:['t-b','עוד לא נבנה']};
  const n=k=>E.filter(e=>e.st===k).length;
  return `<h1>מנועי חישוב</h1><p class="sub">כל מנוע יודע למדוד סוג אלמנט מהתוכנית. המוח מראה מה כל מנוע עושה ומה חסר לו כדי להשתפר.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px"><div class="card kpi"><div class="n">${n('active')}</div><div class="l">פעילים</div></div><div class="card kpi"><div class="n">${n('partial')+n('estimate')}</div><div class="l">חלקיים או הערכה</div></div><div class="card kpi"><div class="n">${n('todo')}</div><div class="l">עוד לא נבנו</div></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">${E.map(e=>`<div class="card"><div class="row"><b style="font-size:17px">${esc(e.name)}</b><span class="sp"></span><span class="tag ${L[e.st][0]}">${L[e.st][1]}</span></div><div class="code" style="text-align:right;margin:4px 0">פרק ${esc(e.ch)}</div>
  <div style="margin:8px 0;font-size:14px">${esc(e.does)}</div><div class="sub" style="margin:0;font-size:13px"><b>מה חסר לו:</b> ${esc(e.needs)}</div></div>`).join('')}</div>`}
async function legacy(){return `<h1>ספריית אימון</h1><p class="sub">מסכי המערכת הקודמת (השוואות, זיון, ממצאים). עוברים בהדרגה לתוך המערכת הזו.</p><div class="card" style="padding:0;overflow:hidden"><iframe src="/legacy" style="width:100%;height:78vh;border:0;background:#fff"></iframe></div>`}

/* ---------- brain ---------- */
async function brain(){
  const N=P.needs||[],g=p=>N.filter(n=>n.p===p),L={high:'דחוף',med:'חשוב',low:'כשיהיה זמן'};
  return `<h1>המוח</h1><p class="sub">מה המערכת יודעת לחשב, מה היא הניחה, ומה חסר לה כדי להשלים את הכתב.</p>
  <div class="card brain" style="margin-bottom:16px"><div class="ic">✦</div><div><b>${P.boq?`חישבתי ${SUM.measured} מתוך ${SUM.items} סעיפים.`:'עוד לא חישבתי כלום.'}</b><div>${N.length?`יש ${N.length} דברים שיעזרו לי להשלים את השאר.`:'אין חסרים.'}</div></div></div>
  <div class="card">${N.length?['high','med','low'].map(p=>g(p).map(n=>`<div class="need"><span class="dot d-${p}"></span><div><b>${esc(n.t)}</b> <span class="tag ${p==='high'?'t-b':p==='med'?'t-w':'t-ok'}">${L[p]}</span><div class="sub" style="margin:2px 0">${esc(n.why)}</div><div style="font-size:13px">מה לעשות: ${esc(n.how)}</div></div></div>`).join('')).join(''):'<div class="empty">אין מה להוסיף</div>'}</div>`}

(async()=>{try{TYPES=(await api('/health')).types;PARAMS=await api('/params')}catch(e){}if(!location.hash)location.hash='#/';render()})();
</script>
</body>
</html>
