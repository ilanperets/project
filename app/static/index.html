<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מערכת כתבי כמויות</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mut:#66708a;--line:#e3e8f1;--pri:#1d3a8a;--pri2:#2f55d4;--acc:#f59e0b;--ok:#15803d;--okb:#e3f6ea;--warn:#a16207;--warnb:#fff4d1;--bad:#b42318;--badb:#fde4e1;--side:#0f1b3d;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0c1224;--card:#141c34;--ink:#e8ecf7;--mut:#93a0c0;--line:#243055;--pri:#7c9cff;--pri2:#9db4ff;--okb:#10301e;--warnb:#33290a;--badb:#3a1612;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--side:#080d1d}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Heebo","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:#dfe6fb;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:6px 10px 18px;font-weight:800;font-size:18px;color:#fff}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#ef4444);display:grid;place-items:center;font-style:normal;color:#fff}
.nav a{display:flex;gap:10px;align-items:center;padding:12px 12px;border-radius:10px;color:#c9d3f2;text-decoration:none;min-height:46px;font-weight:500}
.nav a:hover{background:#1a2a5a}.nav a.on{background:var(--pri2);color:#fff}
.nav .sep{font-size:12px;color:#7d8cb8;padding:14px 12px 4px}
.pname{margin:4px 10px 8px;padding:10px 12px;background:#1a2a5a;border-radius:10px;font-size:13px;color:#fff}
.main{padding:26px 30px 60px;max-width:1400px;width:100%}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(15,27,61,.04)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g2>.grid{align-content:start}.kpi .n{font-size:30px;font-weight:800;letter-spacing:-.5px}.kpi .l{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--acc))}
.btn{border:0;background:var(--pri2);color:#fff;padding:11px 18px;border-radius:10px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px;width:100%}
input.num{width:100px;text-align:left;direction:ltr}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.ch td{background:color-mix(in srgb,var(--pri) 10%,var(--card));font-weight:800}tr.sub td{font-weight:700;color:var(--pri)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);direction:ltr;text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.t-ok{background:var(--okb);color:var(--ok)}.t-w{background:var(--warnb);color:var(--warn)}.t-b{background:var(--badb);color:var(--bad)}
.scroll{overflow:auto;max-height:68vh;border-radius:10px}
.drop{border:2px dashed var(--pri2);border-radius:var(--r);padding:34px;text-align:center;background:color-mix(in srgb,var(--pri2) 6%,var(--card));cursor:pointer}
.drop.over{background:color-mix(in srgb,var(--pri2) 18%,var(--card))}
.brain{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#1d3a8a,#4338ca);color:#fff;border:0}
.brain .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;flex:none}
.brain li{margin:3px 0}.brain ul{padding-inline-start:18px;margin:6px 0}
.need{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.need:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}.d-high{background:var(--bad)}.d-med{background:var(--acc)}.d-low{background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.toast{position:fixed;bottom:22px;left:22px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.proj{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.proj:hover{border-color:var(--pri2)}
.empty{text-align:center;color:var(--mut);padding:40px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:1024px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:5;padding:6px;overflow-x:auto;border-top:1px solid #243055}
.logo,.pname,.nav .sep{display:none}.nav{display:flex;gap:2px;width:100%}.nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-height:54px;white-space:nowrap;justify-content:center}
.main{padding:18px 16px 100px}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media print{.side,.btn{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=2)=>n==null?'':Number(n).toLocaleString('he-IL',{maximumFractionDigits:d});
const money=n=>'₪'+nf(n,0);
const bl=s=>esc(s).replace(/([A-Za-z0-9][A-Za-z0-9.\-_\/]*)/g,'<bdi dir="ltr">$1</bdi>');
let TYPES={},PARAMS={},P=null,SUM=null,busy=false;
async function api(path,opt={}){
  const r=await fetch('/api'+path,opt.body instanceof FormData||opt.method==='GET'||!opt.body?opt:{...opt,headers:{'content-type':'application/json'},body:JSON.stringify(opt.body)});
  if(!r.ok){let m='שגיאה';try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
  return r.json()}
function toast(t){const e=$('#toast');e.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>e.innerHTML='',3500)}
const R=()=>{const h=location.hash.replace('#/','').split('/');return{pid:h[0]==='p'?h[1]:null,page:h[0]==='p'?(h[2]||'dash'):'projects'}};

function side(){
  const {pid,page}=R();const l=(p,i,t)=>`<a href="#/p/${pid}/${p}" class="${page===p?'on':''}"><span>${i}</span>${t}</a>`;
  $('#side').innerHTML=`<div class="logo"><i>▦</i>כתבי כמויות</div><nav class="nav">
  <a href="#/" class="${!pid?'on':''}"><span>◫</span>פרויקטים</a>
  ${pid?`<div class="pname">${esc(P?.name||'')}</div><div class="sep">הפרויקט</div>
  ${l('dash','◉','לוח בקרה')}${l('plans','▤','תוכניות')}${l('boq','☰','כתב כמויות')}${l('materials','▣','חומרים והזמנות')}${l('bills','₪','חשבונות')}${l('brain','✦','המוח')}`:''}</nav>`}

async function render(){
  const {pid,page}=R();
  if(pid){try{P=await api('/projects/'+pid);SUM=await api(`/projects/${pid}/summary`)}catch(e){location.hash='#/';return}}else P=null;
  side();
  const v={projects,dash,plans,boq,materials,bills,brain}[page]||dash;
  $('#main').innerHTML='<div class="empty">טוען…</div>';
  $('#main').innerHTML=await v();
  if(window['after_'+page])window['after_'+page]();
}
window.addEventListener('hashchange',render);

/* ---------- projects ---------- */
async function projects(){
  const ps=await api('/projects');
  return `<h1>הפרויקטים שלי</h1><p class="sub">מעלים תוכניות, המערכת מזהה, מודדת ובונה כתב כמויות.</p>
  <div class="card row" style="margin-bottom:16px"><input id="pn" placeholder="שם פרויקט חדש" style="max-width:340px"><button class="btn" onclick="newProj()">+ פרויקט חדש</button>
   <span class="sp"></span><label class="btn sec">למד מחירים מקובץ אקסל קיים<input type="file" accept=".xlsx" hidden onchange="learnPrices(this)"></label></div>
  <div class="grid">${ps.length?ps.map(p=>`<div class="card proj" onclick="location.hash='#/p/${p.id}/dash'"><div><b>${esc(p.name)}</b><div class="sub" style="margin:0">${p.sheets} גיליונות · ${p.has_boq?'יש כתב כמויות':'עוד לא חושב'}</div></div><div class="row"><button class="btn sec sm" onclick="event.stopPropagation();delProj('${p.id}')">מחק</button><span>←</span></div></div>`).join(''):'<div class="card empty">אין עדיין פרויקטים. פותחים אחד ומעלים תוכניות.</div>'}</div>`}
async function newProj(){const n=$('#pn').value||'פרויקט חדש';const p=await api('/projects',{method:'POST',body:{name:n}});location.hash=`#/p/${p.id}/plans`}
async function delProj(id){if(confirm('למחוק את הפרויקט וכל הקבצים שלו?')){await api('/projects/'+id,{method:'DELETE'});render()}}
async function learnPrices(i){const f=new FormData();f.append('file',i.files[0]);try{const r=await api('/prices/import',{method:'POST',body:f});toast(`נלמדו ${r.learned} מחירים (סה"כ בזיכרון: ${r.total})`)}catch(e){toast(e.message)}}

/* ---------- dashboard ---------- */
async function dash(){
  const s=SUM,pm=s.items?Math.round(s.measured/s.items*100):0,pp=s.items?Math.round(s.priced/s.items*100):0;
  const chs=Object.entries(s.chapters);
  const top=(P.needs||[]).filter(n=>n.p==='high').slice(0,3);
  return `<h1>${esc(s.name)}</h1><p class="sub">מצב הפרויקט במבט אחד</p>
  <div class="grid g4">
   <div class="card kpi"><div class="n">${s.sheets}</div><div class="l">גיליונות בתיק</div></div>
   <div class="card kpi"><div class="n">${pm}%</div><div class="l">סעיפים עם כמות (${s.measured}/${s.items})</div><div class="bar" style="margin-top:8px"><b style="width:${pm}%"></b></div></div>
   <div class="card kpi"><div class="n">${pp}%</div><div class="l">סעיפים מתומחרים</div><div class="bar" style="margin-top:8px"><b style="width:${pp}%"></b></div></div>
   <div class="card kpi"><div class="n">${money(s.total)}</div><div class="l">שווי כתב כמויות מתומחר</div></div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h2>התקדמות לפי פרקים</h2>
   ${s.items?chs.map(([n,c])=>`<div style="margin:12px 0"><div class="row"><span>${esc(n)}</span><span class="sp"></span><span class="tag ${c.measured===c.items?'t-ok':c.measured?'t-w':'t-b'}">${c.measured}/${c.items} סעיפים</span><b>${money(c.total)}</b></div><div class="bar"><b style="width:${c.items?c.measured/c.items*100:0}%"></b></div></div>`).join(''):'<div class="empty">עוד לא חושב כתב. עוברים ללשונית תוכניות ומריצים.</div>'}</div>
   <div class="grid"><div class="card brain"><div class="ic">✦</div><div><b>המוח אומר</b>${top.length?`<ul>${top.map(n=>`<li>${esc(n.t)}</li>`).join('')}</ul>`:'<div style="margin-top:6px">'+(s.items?'אין חסרים דחופים.':'העלה תוכניות ואני אתחיל לעבוד.')+'</div>'}<a href="#/p/${P.id}/brain" style="color:#fde68a">לכל ${s.needs} הפריטים ←</a></div></div>
   <div class="card"><h2>כסף</h2><div class="row"><div><div class="l sub" style="margin:0">חשבונות שהוגשו</div><b style="font-size:22px">${s.bills}</b></div><span class="sp"></span><div><div class="sub" style="margin:0">הזמנות חומר</div><b style="font-size:22px">${s.orders}</b></div></div></div></div></div>`}

/* ---------- plans ---------- */
async function plans(){
  const rows=P.sheets.map(s=>`<tr><td><b>${bl(s.file)}</b><div class="sub" style="margin:0;font-size:12px">${Math.round(s.w_mm)}×${Math.round(s.h_mm)} מ"מ · ${esc(s.why)}</div></td>
  <td><select onchange="setSheet('${s.sid}',{type:this.value})">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${k===s.type?'selected':''}>${t}</option>`).join('')}</select></td>
  <td><span class="tag ${s.confirmed||s.conf==='high'?'t-ok':s.conf==='med'?'t-w':'t-b'}">${s.confirmed?'אושר':s.conf==='high'?'בטוח':s.conf==='med'?'סביר':'לא זוהה'}</span></td>
  <td>${s.type==='floor_plan'?`<select onchange="setSheet('${s.sid}',{floor:this.value})"><option value="">בחר קומה</option>${[['ground','קומת קרקע'],['first','קומה א׳'],['second','קומה ב׳'],['roof','גג']].map(([k,t])=>`<option value="${k}" ${s.floor===k?'selected':''}>${t}</option>`).join('')}</select>`:''}</td></tr>`).join('');
  return `<h1>תוכניות</h1><p class="sub">גוררים קבצי PDF. המערכת מזהה סוג, מנפה כפולים ולומדת מהתיקונים שלך.</p>
  <label class="drop" id="drop"><b style="font-size:18px">גרור לכאן תוכניות PDF</b><div class="sub" style="margin:6px 0 0">או לחץ לבחירה, אפשר כמה קבצים יחד</div><input type="file" id="fi" multiple accept=".pdf" hidden></label>
  <div class="card" style="margin-top:16px"><div class="row"><h2 style="margin:0">${P.sheets.length} גיליונות בתיק</h2><span class="sp"></span><button class="btn" id="runb" onclick="runAll()" ${P.sheets.length?'':'disabled'}>חשב כתב כמויות ▸</button></div>
  ${P.sheets.length?`<div class="scroll" style="margin-top:12px"><table><tr><th>קובץ</th><th>סוג</th><th>ודאות</th><th>קומה</th></tr>${rows}</table></div>`:'<div class="empty">עוד לא הועלו תוכניות</div>'}</div>
  ${P.log.length?`<div class="card" style="margin-top:16px"><h2>יומן החישוב האחרון</h2>${P.log.map(l=>`<div class="sub" style="margin:2px 0">${bl(l)}</div>`).join('')}</div>`:''}`}
window.after_plans=()=>{const d=$('#drop'),f=$('#fi');if(!d)return;
  f.onchange=()=>up(f.files);['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',x=>up(x.dataTransfer.files))};
async function up(files){const f=new FormData();[...files].forEach(x=>f.append('files',x));$('#drop').innerHTML='<b>מעלה ומזהה… זה לוקח רגע לכל גיליון</b>';
  try{const r=await api(`/projects/${P.id}/upload`,{method:'POST',body:f});const d=r.added.filter(a=>a.dup_of).length,e=r.added.filter(a=>a.error).length;toast(`נקלטו ${r.added.filter(a=>a.sid).length} גיליונות${d?`, ${d} כפולים הוסרו`:''}${e?`, ${e} נכשלו`:''}`)}catch(x){toast(x.message)}render()}
async function setSheet(sid,b){await api(`/projects/${P.id}/sheets/${sid}`,{method:'POST',body:b});toast(b.type?'נשמר. המערכת תזהה כך גיליונות דומים בפעם הבאה':'נשמר');render()}
async function runAll(){const b=$('#runb');b.disabled=true;b.innerHTML='<span class="spin"></span> מחשב…';try{await api(`/projects/${P.id}/run`,{method:'POST'});toast('הכתב חושב');location.hash=`#/p/${P.id}/boq`}catch(e){toast(e.message);b.disabled=false}}

/* ---------- BOQ ---------- */
async function boq(){
  if(!P.boq)return `<h1>כתב כמויות</h1><div class="card empty">עוד לא חושב. העלה תוכניות והרץ חישוב.</div>`;
  const pr=P.prices;let last='';
  const tr=P.boq.map(r=>{
    if(r.kind==='ch')return `<tr class="ch"><td class="code">${r.code}</td><td colspan="7">${esc(r.desc)}</td></tr>`;
    if(r.kind==='sub')return `<tr class="sub"><td class="code">${r.code}</td><td colspan="7">${esc(r.desc)}</td></tr>`;
    const q=r.q,p=pr[r.code],tot=q&&p?q*p:null;
    return `<tr><td class="code">${r.code}</td><td>${esc(r.desc)}${r.need?`<div class="sub" style="margin:0;font-size:12px">${esc(r.need)}</div>`:''}<span class="sug" id="s-${r.code}"></span></td><td>${esc(r.unit)}</td>
    <td>${q==null?'<span class="tag t-b">חסר</span>':`<b>${nf(q)}</b>${r.st==='חלקי'?' <span class="tag t-w">חלקי</span>':''}`}</td>
    <td><input class="num" data-c="${r.code}" value="${p??''}" placeholder="מחיר" ${q==null?'disabled':''} onchange="setPrice(this)"></td><td>${tot!=null?money(tot):''}</td><td style="font-size:12px;color:var(--mut)">${esc(r.src)}</td></tr>`}).join('');
  const prm=Object.entries(PARAMS).map(([k,d])=>`<div><label style="font-size:12px;color:var(--mut)">${d.label}</label><input class="num" style="width:100%" id="pp-${k}" value="${P.params[k]??d.v}"></div>`).join('');
  return `<h1>כתב כמויות</h1><p class="sub">בפורמט כתב כמויות מכרזי: מספור היררכי, כמות, מחיר וסה"כ. מלא מחיר והסה"כ מתעדכן.</p>
  <div class="row" style="margin-bottom:14px"><button class="btn sec" onclick="suggestAll()">הצע מחירים מהזיכרון</button><button class="btn sec" onclick="remember()">שמור מחירים לזיכרון</button><span class="sp"></span>
   <a class="btn sec" href="/api/projects/${P.id}/export.xlsx">ייצוא כתב (Excel)</a><a class="btn" href="/api/projects/${P.id}/quote.xlsx">הצעת מחיר (Excel)</a></div>
  <div class="card"><div class="scroll"><table><tr><th>מספר</th><th>תיאור</th><th>יח'</th><th>כמות</th><th>מחיר</th><th>סה"כ</th><th>מקור</th></tr>${tr}</table></div>
  <div class="row" style="margin-top:14px;font-size:18px"><span class="sp"></span><b>סה"כ מתומחר: ${money(SUM.total)}</b></div></div>
  <details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">הנחות החישוב (ניתן לשנות, והחישוב ירוץ מחדש)</summary><div class="grid g4" style="margin-top:12px">${prm}</div><button class="btn" style="margin-top:12px" onclick="saveParams()">שמור וחשב מחדש</button></details>`}
async function setPrice(i){await api(`/projects/${P.id}/prices`,{method:'POST',body:{items:{[i.dataset.c]:i.value}}});render()}
async function remember(){await api(`/projects/${P.id}/prices`,{method:'POST',body:{items:{},remember:true}});toast('המחירים נשמרו בזיכרון המערכת ויוצעו בפרויקטים הבאים')}
async function suggestAll(){const s=await api(`/projects/${P.id}/suggest`,{method:'POST'});const ks=Object.keys(s);if(!ks.length){toast('אין הצעות מתאימות בזיכרון עדיין');return}
  ks.forEach(k=>{const e=$('#s-'+k);if(e)e.innerHTML=`<div><button class="btn sm sec" onclick="takeSug('${k}',${s[k].price})">₪${s[k].price} · התאמה ${s[k].match}% — החל</button></div>`});toast(`${ks.length} הצעות`)}
async function takeSug(k,p){await api(`/projects/${P.id}/prices`,{method:'POST',body:{items:{[k]:p}}});render()}
async function saveParams(){const b={};Object.keys(PARAMS).forEach(k=>b[k]=$('#pp-'+k).value);await api(`/projects/${P.id}/params`,{method:'POST',body:b});await api(`/projects/${P.id}/run`,{method:'POST'});toast('חושב מחדש');render()}

/* ---------- materials & orders ---------- */
async function materials(){
  if(!P.materials.length)return `<h1>חומרים והזמנות</h1><div class="card empty">אחרי חישוב כתב הכמויות, כאן יופיע פירוק לחומרים להזמנה.</div>`;
  const rows=P.materials.map((m,i)=>`<tr><td><input type="checkbox" class="ck" data-i="${i}" checked></td><td><b>${esc(m.material)}</b><div class="code" style="text-align:right">${m.codes.slice(0,4).join(' · ')}</div></td><td>${esc(m.unit)}</td><td><input class="num" id="q${i}" value="${m.qty}"></td>
   <td><input class="num" value="${P.mprices[m.material]??''}" placeholder="מחיר" onchange="setMp('${esc(m.material)}',this.value)"></td><td>${P.mprices[m.material]?money(m.qty*P.mprices[m.material]):''}</td></tr>`).join('');
  const tot=P.materials.reduce((a,m)=>a+(P.mprices[m.material]?m.qty*P.mprices[m.material]:0),0);
  const os=P.orders.map(o=>`<tr><td>#${o.n}</td><td>${esc(o.supplier)}</td><td>${o.items.length} חומרים</td><td>${esc(o.needed||'-')}</td>
   <td><select onchange="ostat(${o.n},this.value)">${['טיוטה','נשלחה','סופקה חלקית','סופקה','בוטלה'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><a class="btn sm sec" href="/api/projects/${P.id}/orders/${o.n}.xlsx">הורד</a></td></tr>`).join('');
  return `<h1>חומרים והזמנות</h1><p class="sub">כתב הכמויות מפורק לחומרים לפי מתכוני ביצוע, כולל פחת. בוחרים מה להזמין ומפיקים הזמנת רכש.</p>
  <div class="card"><div class="scroll"><table><tr><th></th><th>חומר</th><th>יח'</th><th>כמות להזמנה</th><th>מחיר</th><th>סה"כ</th></tr>${rows}</table></div>
  <div class="row" style="margin-top:14px"><input id="sup" placeholder="שם ספק" style="max-width:220px"><input id="need" type="date" style="max-width:170px" title="תאריך אספקה"><input id="note" placeholder="הערה לספק" style="max-width:260px"><span class="sp"></span><b>${money(tot)}</b><button class="btn ok" onclick="mkOrder()">הפק הזמנת רכש</button></div></div>
  <div class="card" style="margin-top:16px"><h2>הזמנות שנוצרו</h2>${P.orders.length?`<table><tr><th>#</th><th>ספק</th><th>פריטים</th><th>אספקה</th><th>סטטוס</th><th></th></tr>${os}</table>`:'<div class="empty">עוד אין הזמנות</div>'}</div>`}
async function setMp(m,v){await api(`/projects/${P.id}/prices`,{method:'POST',body:{materials:{[m]:v}}});render()}
async function mkOrder(){const items=[...document.querySelectorAll('.ck')].filter(c=>c.checked).map(c=>{const m=P.materials[c.dataset.i];return{material:m.material,unit:m.unit,qty:$('#q'+c.dataset.i).value}});
  try{await api(`/projects/${P.id}/orders`,{method:'POST',body:{items,supplier:$('#sup').value,needed:$('#need').value,note:$('#note').value}});toast('ההזמנה נוצרה');render()}catch(e){toast(e.message)}}
async function ostat(n,s){await api(`/projects/${P.id}/orders/${n}`,{method:'POST',body:{status:s}});toast('עודכן')}

/* ---------- bills ---------- */
async function bills(){
  if(!P.boq)return `<h1>חשבונות</h1><div class="card empty">צריך כתב כמויות מתומחר.</div>`;
  const prev=P.bills.length?P.bills[P.bills.length-1].pct:{};
  const items=P.boq.filter(r=>r.kind==='item'&&r.q&&P.prices[r.code]);
  const rows=items.map(r=>`<tr><td class="code">${r.code}</td><td>${esc(r.desc)}</td><td>${money(r.q*P.prices[r.code])}</td><td>${nf(prev[r.code]||0,0)}%</td><td><input class="num" data-b="${r.code}" value="${prev[r.code]||0}" style="width:80px"> %</td></tr>`).join('');
  const list=P.bills.map(b=>`<tr><td>חשבון ${b.n}</td><td>${b.date}</td><td>${money(b.this)}</td><td>${money(b.retention)}</td><td>${money(b.vat)}</td><td><b>${money(b.total)}</b></td></tr>`).join('');
  return `<h1>חשבונות חלקיים</h1><p class="sub">מזינים אחוז ביצוע מצטבר לכל סעיף. המערכת מחשבת חלק החשבון הנוכחי, עיכבון ומע"מ.</p>
  <div class="card"><h2>חשבון חדש</h2>${items.length?`<div class="scroll"><table><tr><th>מספר</th><th>סעיף</th><th>שווי</th><th>קודם</th><th>מצטבר עכשיו</th></tr>${rows}</table></div><button class="btn" style="margin-top:12px" onclick="mkBill()">הפק חשבון</button>`:'<div class="empty">אין סעיפים מתומחרים. מלא מחירים בלשונית כתב כמויות.</div>'}</div>
  <div class="card" style="margin-top:16px"><h2>חשבונות שהוגשו</h2>${P.bills.length?`<table><tr><th>חשבון</th><th>תאריך</th><th>לחשבון זה</th><th>עיכבון</th><th>מע"מ</th><th>סה"כ לתשלום</th></tr>${list}</table>`:'<div class="empty">עוד לא הוגש חשבון</div>'}</div>`}
async function mkBill(){const pct={};document.querySelectorAll('[data-b]').forEach(i=>pct[i.dataset.b]=i.value);
  const b=await api(`/projects/${P.id}/bills`,{method:'POST',body:{pct}});toast(`חשבון ${b.n}: ${money(b.total)} לתשלום`);render()}

/* ---------- brain ---------- */
async function brain(){
  const N=P.needs||[],g=p=>N.filter(n=>n.p===p),L={high:'דחוף',med:'חשוב',low:'כשיהיה זמן'};
  return `<h1>המוח</h1><p class="sub">מה המערכת יודעת לחשב, מה היא הניחה, ומה חסר לה כדי להשלים את הכתב.</p>
  <div class="card brain" style="margin-bottom:16px"><div class="ic">✦</div><div><b>${P.boq?`חישבתי ${SUM.measured} מתוך ${SUM.items} סעיפים.`:'עוד לא חישבתי כלום.'}</b><div>${N.length?`יש ${N.length} דברים שיעזרו לי להשלים את השאר.`:'אין חסרים.'}</div></div></div>
  <div class="card">${N.length?['high','med','low'].map(p=>g(p).map(n=>`<div class="need"><span class="dot d-${p}"></span><div><b>${esc(n.t)}</b> <span class="tag ${p==='high'?'t-b':p==='med'?'t-w':'t-ok'}">${L[p]}</span><div class="sub" style="margin:2px 0">${esc(n.why)}</div><div style="font-size:13px">מה לעשות: ${esc(n.how)}</div></div></div>`).join('')).join(''):'<div class="empty">אין מה להוסיף</div>'}</div>`}

(async()=>{try{TYPES=(await api('/health')).types;PARAMS=await api('/params')}catch(e){}if(!location.hash)location.hash='#/';render()})();
</script>
</body>
</html>
