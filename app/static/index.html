/* ---------- brain ---------- */
async function brain(){
  const N=P.needs||[],g=p=>N.filter(n=>n.p===p),L={high:'דחוף',med:'חשוב',low:'כשיהיה זמן'};
  return `<h1>המוח</h1><p class="sub">מה המערכת יודעת לחשב, מה היא הניחה, ומה חסר לה כדי להשלים את הכתב.</p>
  <div class="card brain" style="margin-bottom:16px"><div class="ic">✦</div><div><b>${P.boq?`חישבתי ${SUM.measured} מתוך ${SUM.items} סעיפים.`:'עוד לא חישבתי כלום.'}</b><div>${N.length?`יש ${N.length} דברים שיעזרו לי להשלים את השאר.`:'אין חסרים.'}</div></div></div>
  <div class="card">${N.length?['high','med','low'].map(p=>g(p).map(n=>`<div class="need"><span class="dot d-${p}"></span><div><b>${esc(n.t)}</b> <span class="tag ${p==='high'?'t-b':p==='med'?'t-w':'t-ok'}">${L[p]}</span><div class="sub" style="margin:2px 0">${esc(n.why)}</div><div style="font-size:13px">מה לעשות: ${esc(n.how)}</div></div></div>`).join('')).join(''):'<div class="empty">אין מה להוסיף</div>'}</div>`}

(async()=>{try{TYPES=(await api('/health')).types;PARAMS=await api('/params')}catch(e){}if(!location.hash)location.hash='#/';render()})();
</script>
</body>
</html>
