 [10,1,'פנל שיפולים מאריחים בגובה 10 ס"מ','מ"א',null,'m',0,'חסר: היקפי חדרים'],

 [22,1,'מחיצות גבס חד קרומיות על קונסטרוקציה','מ"ר',54,'p',0,'ידני: לפי תוכנית אדריכלות']];

D[0].pr=520;D[1].pr=780;D[4].pr=165;D[9].pr=62;D[10].pr=240;
const SUB={'2.1':'עבודות בטון','2.2':'תקרות ורצפות','4.1':'קירות','5.1':'איטום','9.1':'טיח פנים','10.1':'ריצוף','10.2':'חיפוי','22.1':'מחיצות'};
const PAL=['#174F96'];const col=c=>PAL[Object.keys(CH).map(Number).sort((a,b)=>a-b).indexOf(+c)%PAL.length];
let nid=100,tab='dash',flt='all',qs='',coll={},hist=[],sel=null,VAT=18;
const nf=x=>x==null||x===''?'':(+x).toLocaleString('he-IL',{maximumFractionDigits:2});const mn=x=>'₪'+Math.round(x).toLocaleString('he-IL');

const miss=()=>D.filter(r=>r.q==null||r.q==='').length,part=()=>D.filter(r=>r.st==='p').length;
const TABS=[['dash','דשבורד'],['boq','כתב כמויות'],['sum','סיכום פרקים'],['calc','דפי חישוב'],['need','מה חסר',()=>miss()+part()],['mat','חומרים והזמנות'],['how','שיטות ומקורות'],['guide','הנחיות']];
function tabs(){document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}${t[2]?`<span class="bd">${t[2]()}</span>`:''}</button>`).join('')}
function chTot(c){return D.filter(r=>r.ch==c).reduce((a,r)=>a+tot(r),0)}
function dash(){
 const T=D.reduce((a,r)=>a+tot(r),0),n=D.length,ok=D.filter(r=>r.q!=null&&r.q!==''&&r.st!=='p').length,pc=part(),ms=miss();
 const chs=[...new Set(D.map(r=>r.ch))],mx=Math.max(...chs.map(chTot),1);
 const seg=[['נמדד',ok,'#1C8248'],['חלקי',pc,'#E0A100'],['חסר',ms,'#C0392B']],R=52,C=2*Math.PI*R;let off=0;
 const arcs=seg.map(s=>{const l=C*s[1]/n,a=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${s[2]}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return a}).join('');
 return `<section class="bpp" style="margin-bottom:0"><div class="kp"><div><div class="l">סה"כ לפני מע"מ</div><div class="v">${mn(T)}</div><div class="d">לפי מחירים שהזנת</div></div><div><div class="l">כולל מע"מ ${VAT}%</div><div class="v">${mn(T*(1+VAT/100))}</div><div class="d">מחושב אוטומטית</div></div><div><div class="l">סעיפים עם כמות</div><div class="v">${n-ms}/${n}</div><div class="d">${Math.round((n-ms)/n*100)}% כיסוי</div></div><div><div class="l">דורשים תשומת לב</div><div class="v" style="color:#FFC9A8">${ms+pc}</div><div class="d">${ms} חסרים · ${pc} חלקיים</div></div></div></section>
 <div class="cc">${chs.map(c=>{const rs=D.filter(r=>r.ch==c),k=rs.filter(r=>r.q!=null&&r.q!=='').length;return `<div style="--c:${col(c)}"><div class="nm"><i>${String(c).padStart(2,'0')}</i>${CH[c]}</div><div class="am">${mn(chTot(c))}</div><div class="mt"><span>${rs.length} סעיפים</span><span>${Math.round(k/rs.length*100)}% עם כמות</span></div><div class="pb"><i style="width:${k/rs.length*100}%"></i></div></div>`}).join('')}</div><div class="dg"><div class="card"><h2 style="margin-bottom:8px">שווי לפי פרק</h2>${chs.map(c=>`<div class="hb" style="--c:${col(c)}"><span>${String(c).padStart(2,'0')} · ${CH[c]}</span><div class="bar"><i style="width:${Math.max(chTot(c)/mx*100,1.5)}%"></i></div><b>${mn(chTot(c))}</b></div>`).join('')}</div>
 <div class="card"><h2 style="margin-bottom:10px">מצב הכמויות</h2><div class="don"><svg width="140" height="140" viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#EDF1F7" stroke-width="20"/>${arcs}<text x="70" y="76" text-anchor="middle" font-size="22" font-weight="700">${Math.round(ok/n*100)}%</text></svg><div class="lgd">${seg.map(s=>`<div><i style="background:${s[2]}"></i>${s[0]} <b>${s[1]}</b></div>`).join('')}</div></div>

function boq(){
 const f=r=>(flt==='all'||(flt==='miss'&&(r.q==null||r.q===''))||(flt==='part'&&r.st==='p')||(flt==='man'&&r.st==='m'))&&(!qs||(r.d+r.id).includes(qs));
 let h=`<div class="bar2"><div class="sr">${IC.sr}<input id="qs" placeholder="חיפוש סעיף..." value="${qs}" oninput="qs=this.value;draw(true)"></div>${[['all','הכל'],['miss','חסר כמות'],['part','חלקי'],['man','ידני']].map(x=>`<button class="fchip ${flt===x[0]?'on':''}" onclick="flt='${x[0]}';draw()">${x[1]}</button>`).join('')}<span class="hint" style="margin-inline-start:auto">לחץ על תא כדי לערוך. Enter עובר שורה. גרור ב-⋮ או השתמש בחצים כדי לסדר.</span><button class="btn" onclick="addCh()">${IC.pl} פרק חדש</button></div><div class="grid"><table><colgroup><col width="96"><col><col width="76"><col width="96"><col width="108"><col width="120"><col width="118"></colgroup><tr><th>סעיף</th><th>תיאור</th><th>יח'</th><th>כמות</th><th>מחיר יחידה</th><th>סה"כ</th><th></th></tr>`;
 const chs=[...new Set(D.map(r=>r.ch))].sort((a,b)=>a-b);
 for(const c of chs){const rows=D.filter(r=>r.ch==c);const open=!coll[c];
  h+=`<tr class="ch" style="--c:${col(c)}"><td colspan="7"><span class="chv ${open?'':'c'}" onclick="coll[${c}]=!coll[${c}];draw()">${IC.ch}</span><b>פרק ${String(c).padStart(2,'0')} — ${CH[c]||'פרק חדש'}</b><span style="float:left;opacity:.9">${mn(chTot(c))}</span></td></tr>`;
  if(!open)continue;
  const subs=[...new Set(rows.map(r=>r.sub))].sort((a,b)=>a-b);
  for(const s of subs){h+=`<tr class="sb" style="--c:${col(c)}"><td colspan="7">${String(c).padStart(2,'0')}.${String(s).padStart(2,'0')}  ${SUB[c+'.'+s]||'תת-פרק'}</td></tr>`;
   rows.filter(r=>r.sub==s).forEach((r,i)=>{if(!f(r))return;const cl=(r.q==null||r.q==='')?'q-miss':(r.st==='p'?'q-part':(r.st==='m'?'q-man':''));

    <td><div class="cell" contenteditable onblur="ed(${r.id},'d',this.textContent)" onkeydown="kd(event)">${r.d}</div><div class="src">${r.note}</div></td>
    <td><div class="cell"><select onchange="ed(${r.id},'u',this.value)">${['מ"ר','מ"ק','מ"א','יח\'','טון','ק"ג','קומפ\'','נק\'','ש"ע'].map(u=>`<option ${u==r.u?'selected':''}>${u}</option>`).join('')}</select></div></td>
    <td><div class="cell n ${cl}" contenteditable onblur="ed(${r.id},'q',this.textContent)" onkeydown="kd(event)">${nf(r.q)}</div></td>
    <td><div class="cell n pr" contenteditable onblur="ed(${r.id},'pr',this.textContent)" onkeydown="kd(event)">${nf(r.pr)}</div></td>
    <td><div class="cell n" style="font-weight:600">${tot(r)?mn(tot(r)):'—'}</div></td>
    <td><div class="acts"><button class="ib" title="למעלה" onclick="mv(${r.id},-1)">${IC.up}</button><button class="ib" title="למטה" onclick="mv(${r.id},1)">${IC.dn}</button><button class="ib" title="שכפל" onclick="dup(${r.id})">${IC.cp}</button><button class="ib bad" title="מחק" onclick="del(${r.id})">${IC.tr}</button></div></td></tr>`});
   h+=`<tr class="addr" style="--c:${col(c)}"><td></td><td colspan="6"><button onclick="add(${c},${s})">+ הוסף סעיף ל-${SUB[c+'.'+s]||'תת-פרק'}</button></td></tr>`}
  h+=`<tr class="tot" style="--c:${col(c)}"><td></td><td colspan="4">סה"כ ${CH[c]||''}</td><td style="text-align:left;padding-inline:12px">${mn(chTot(c))}</td><td></td></tr>`}
 const T=D.reduce((a,r)=>a+tot(r),0);

function sum(){return `<div class="card pt2"><table><tr><th>פרק</th><th>סעיפים</th><th>עם כמות</th><th>כיסוי</th><th>סה"כ</th></tr>${[...new Set(D.map(r=>r.ch))].map(c=>{const rs=D.filter(r=>r.ch==c),k=rs.filter(r=>r.q!=null&&r.q!=='').length;return `<tr><td>${String(c).padStart(2,'0')} · ${CH[c]}</td><td>${rs.length}</td><td>${k}</td><td>${Math.round(k/rs.length*100)}%</td><td><b>${mn(chTot(c))}</b></td></tr>`}).join('')}</table></div>`}
function need(){const m=D.filter(r=>r.q==null||r.q===''||r.st==='p');return `<div class="card pt2"><table><tr><th>מצב</th><th>סעיף</th><th>מה חסר / מה לעשות</th></tr>${m.map(r=>`<tr><td><span class="tag ${r.q==null?'t-r':'t-w'}" style="${r.q==null?'background:var(--badb);color:var(--bad)':'background:var(--warnb);color:var(--warn)'}">${r.q==null?'חסר':'חלקי'}</span></td><td>${r.d}</td><td>${r.note}</td></tr>`).join('')}</table></div>`}
const STUB={calc:'דפי חישוב: לכל סעיף נוסחה, ההמשך מידות, וחיתוך התוכנית שממנה נלקחו. לחיצה על סעיף פותחת אותו.',mat:'חומרים והזמנות: פירוק הכתב לחומרים, ספקים והזמנות.',how:'שיטות ומקורות: אופן המדידה ומקור הכמות לכל סעיף.',guide:'הנחיות: מספור, כללי מדידה, מה כלול במחיר היחידה.'};
function draw(keep){tabs();const v=document.getElementById('view');v.innerHTML=tab==='dash'?dash():tab==='boq'?boq():tab==='sum'?sum():tab==='need'?need():`<div class="card"><h2>${TABS.find(t=>t[0]===tab)[1]}</h2><p class="hint">${STUB[tab]} (קיים כבר במערכת, יוצג כאן באותו עיצוב.)</p></div>`;if(keep){const e=document.getElementById('qs');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
function ed(id,k,v){const r=D.find(x=>x.id==id);let nv=v;if(k==='q'||k==='pr'){nv=v.replace(/[^0-9.\-]/g,'');nv=nv===''?(k==='q'?null:''):+nv}if(r[k]===nv||(k=='d'&&r.d===v))return;snap();r[k]=nv;if(k==='q'&&nv!=null)r.st=r.st==='p'?'p':'m';draw();toast('נשמר')}
function kd(e){if(e.key==='Enter'){e.preventDefault();e.target.blur()}}
function add(c,s){snap();D.push({id:nid++,ch:c,sub:s,d:'סעיף חדש',u:'מ"ר',q:null,st:'m',pr:'',note:'הוזן ידנית'});draw();toast('סעיף נוסף')}
function dup(id){const r=D.find(x=>x.id==id);snap();D.splice(D.indexOf(r)+1,0,{...r,id:nid++,note:'שוכפל'});draw();toast('שוכפל')}
function del(id){snap();D=D.filter(x=>x.id!=id);draw();toast('נמחק. אפשר לבטל')}
function mv(id,d){const r=D.find(x=>x.id==id),g=D.filter(x=>x.ch==r.ch&&x.sub==r.sub),i=g.indexOf(r),o=g[i+d];if(!o)return;snap();const a=D.indexOf(r),b=D.indexOf(o);[D[a],D[b]]=[D[b],D[a]];draw()}
function addCh(){snap();const c=Math.max(...Object.keys(CH).map(Number))+1;CH[c]='פרק חדש';SUB[c+'.1']='סעיפים';D.push({id:nid++,ch:c,sub:1,d:'סעיף חדש',u:'מ"ר',q:null,st:'m',pr:'',note:'הוזן ידנית'});draw();toast('פרק נוסף')}
draw();
</script></div></body></html>
